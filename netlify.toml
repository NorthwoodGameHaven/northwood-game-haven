# App deep-link verification files (Android App Links / iOS Universal Links)
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

