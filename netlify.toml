# Nightly auto-cancel of unpaid approved bookings.
[functions."auto-cancel"]
  schedule = "@daily"

# Daily event-promotion task digest -> promo inbox (12:00 UTC = 6-7 AM Central).
[functions."promo-digest"]
  schedule = "0 12 * * *"

# Lightspeed catalog sync for Order Ahead, every 30 min (NGH-BUILD 2026-09-11a)
[functions."shop-sync"]
  schedule = "*/30 * * * *"

# T-1 registrant reminder emails, 14:00 UTC = 9 AM Central (NGH-BUILD 2026-08-26c)
[functions."reminders"]
  schedule = "0 14 * * *"

