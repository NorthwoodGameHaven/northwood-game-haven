<!DOCTYPE html>
<!-- NGH-BUILD 10b · 2026-09-04b — 10a + Reflex Rally re-port + TV-stack integration -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>NGH Trivia Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --forest:#2d5a3d; --forest-dk:#1c3a26; --gold:#e7c15b; --gold-dk:#c9973a;
    --cream:#f6efdd; --maroon:#7a2e2e; --red:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--forest-dk);color:var(--cream);
    font-family:'Nunito',sans-serif;cursor:none}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:11vmin 4vmin 4vmin;box-sizing:border-box}
  .brand{font-family:'Alfa Slab One',serif;color:var(--gold);letter-spacing:.02em}
  .sub{font-family:'Caveat',cursive;color:var(--cream);opacity:.9}
  #roundTag{position:fixed;top:2.2vmin;left:2.6vmin;font-weight:800;font-size:3vmin;
    color:var(--gold);text-transform:uppercase;letter-spacing:.08em;display:none}
  #wagerTag{position:fixed;top:2.2vmin;right:2.6vmin;font-family:'Alfa Slab One',serif;
    font-size:3.2vmin;color:var(--red);background:var(--cream);padding:.6vmin 1.8vmin;
    border-radius:2vmin;display:none;transform:rotate(2deg)}
  #timer{position:fixed;bottom:2.4vmin;right:3vmin;font-family:'Alfa Slab One',serif;
    font-size:7vmin;color:var(--gold);display:none}
  #timer.hot{color:var(--red)}
  .prompt{font-size:6.2vmin;font-weight:800;line-height:1.25;max-width:88vw}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:2.4vmin;margin-top:4.5vmin;max-width:88vw}
  .choice{background:var(--forest);border:.45vmin solid var(--gold);border-radius:2vmin;
    padding:2.6vmin 3vmin;font-size:4.2vmin;font-weight:800;text-align:left}
  .choice b{color:var(--gold);margin-right:1.4vmin}
  .choice.win{background:var(--gold);color:var(--forest-dk)}
  .choice.win b{color:var(--maroon)}
  .devban-bottom{position:fixed;bottom:3vmin;left:50%;transform:translateX(-50%);z-index:2;margin:0}
  .intclock{font-family:'Alfa Slab One',serif;font-size:12vmin;color:var(--gold);line-height:1;margin:1vmin 0;
    text-shadow:0 .4vmin 1.2vmin rgba(0,0,0,.45)}
  .intgrid{display:flex;gap:4vmin;justify-content:center;align-items:flex-start;margin-top:2.5vmin;max-width:92vw}
  .intpanel{background:rgba(20,34,24,.55);border:.35vmin solid var(--gold-dk);border-radius:1.6vmin;padding:1.6vmin 2.2vmin;min-width:32vmin}
  .intpanel h4{font-family:'Alfa Slab One',serif;color:var(--gold);font-size:2.8vmin;margin:0 0 1vmin;font-weight:normal}
  .introw{display:flex;gap:1.4vmin;font-size:2.7vmin;font-weight:800;padding:.5vmin 0;text-align:left}
  .introw.done{opacity:.4;text-decoration:line-through}
  .introw.cur{color:var(--gold)}
  video,audio{max-width:88vw;max-height:62vh;border:.5vmin solid var(--gold);border-radius:1.6vmin;background:#000}
  img.clue{max-width:80vw;max-height:60vh;border:.5vmin solid var(--gold);border-radius:1.6vmin}
  #ytWrap{position:relative;width:72vw;height:40.5vw;max-height:56vh;max-width:99.5vh;margin:2vmin auto;
    border:.5vmin solid var(--gold);border-radius:1.6vmin;overflow:hidden;background:#000}
  #ytWrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #ytCover{position:absolute;inset:0;background:var(--forest-dk);display:none;
    align-items:center;justify-content:center;flex-direction:column;color:var(--gold);
    font-family:'Alfa Slab One',serif;font-size:9vmin;text-align:center}
  #ytWrap.audioonly #ytCover{display:flex}
  #ytBlock{position:absolute;left:0;right:0;bottom:0;height:16%;background:transparent}
  #overlay{position:fixed;inset:0;background:rgba(20,34,24,.96);display:none;
    flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center}
  #overlay .brand{font-size:7vmin}
  #overlay .msg{font-size:4vmin;margin-top:2.5vmin;font-weight:700}
  #fsBtn{position:fixed;inset:0;background:transparent;border:0;z-index:60;cursor:pointer;display:none}
  table.board{border-collapse:collapse;font-size:4.4vmin;min-width:60vw}
  table.board td,table.board th{padding:1.4vmin 3vmin;border-bottom:.3vmin solid rgba(231,193,91,.35);text-align:left}
  table.board td:last-child{text-align:right;font-family:'Alfa Slab One',serif;color:var(--gold)}
  table.board tr.gold td{color:var(--gold)}
  #qrBox{background:#fff;padding:2vmin;border-radius:2vmin;margin-top:4vmin}
  .small{font-size:2.6vmin;opacity:.75;margin-top:2vmin}
  .devban{background:var(--maroon);color:#fff;font-weight:800;font-size:2.8vmin;
    padding:1vmin 2.4vmin;border-radius:1.2vmin;letter-spacing:.02em;max-width:92vw}
  /* ---- tournament timer layout (NGH-BUILD 08a) ---- */
  body.wx{transition:background 2s}
  body.wx-clear-day{background:linear-gradient(#3f7fc4 0%,#7db2df 55%,#284a33 100%)}
  body.wx-clear-night{background:linear-gradient(#0a1026 0%,#141c3a 60%,#101b12 100%)}
  body.wx-cloudy-day{background:linear-gradient(#6a7f90 0%,#93a3ad 55%,#2a4433 100%)}
  body.wx-cloudy-night{background:linear-gradient(#141824 0%,#232a38 60%,#131d14 100%)}
  body.wx-rain-day{background:linear-gradient(#4a5b68 0%,#697c88 55%,#233b2c 100%)}
  body.wx-rain-night{background:linear-gradient(#0e1420 0%,#1b2430 60%,#111a12 100%)}
  body.wx-snow-day{background:linear-gradient(#8ea3b5 0%,#c3d2dd 55%,#39543f 100%)}
  body.wx-snow-night{background:linear-gradient(#131a2c 0%,#2a3446 60%,#16211a 100%)}
  body.wx-storm-day{background:linear-gradient(#39434e 0%,#525f6b 55%,#1e3326 100%)}
  body.wx-storm-night{background:linear-gradient(#0a0e16 0%,#161c26 60%,#0e150f 100%)}
  #wxLayer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  #sunGlow{position:absolute;top:6vmin;right:30vw;width:16vmin;height:16vmin;border-radius:50%;
    background:radial-gradient(circle,#ffe9a3 0%,#f5c542 45%,rgba(245,197,66,0) 72%);display:none;
    animation:sunpulse 6s ease-in-out infinite}
  @keyframes sunpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #moon{position:absolute;top:7vmin;right:31vw;width:9vmin;height:9vmin;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#f4f1e0,#c9c6b4);box-shadow:0 0 4vmin rgba(244,241,224,.5);display:none}
  .star{position:absolute;width:.4vmin;height:.4vmin;background:#fff;border-radius:50%;opacity:.8;
    animation:twinkle 3s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.95}}
  .cloud{position:absolute;background:rgba(255,255,255,.75);border-radius:50vmin;filter:blur(.6vmin);
    animation:drift linear infinite}
  .wx-night .cloud, body[class*="night"] .cloud{background:rgba(180,190,205,.35)}
  @keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
  .drop{position:absolute;top:-6vmin;width:.28vmin;height:3.4vmin;background:linear-gradient(rgba(180,210,255,0),rgba(180,210,255,.85));
    animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(115vh)}}
  .flake{position:absolute;top:-4vmin;color:#fff;font-size:2vmin;opacity:.9;animation:snowfall linear infinite}
  @keyframes snowfall{0%{transform:translateY(-5vh) translateX(0)}50%{transform:translateY(52vh) translateX(3vmin)}100%{transform:translateY(112vh) translateX(-2vmin)}}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2}
  #stage,#tHead,#roundTag,#wagerTag,#timer{z-index:1}
  body.wx #stage{justify-content:flex-start;padding:19vmin 27vw 4vmin;box-sizing:border-box}
  body.wx #stage .tlabel:first-child{margin-top:0}
  .tblGrid{margin-top:2.4vmin;background:rgba(20,34,24,.62);border:.35vmin solid var(--gold-dk);border-radius:1.6vmin;padding:1.4vmin 2vmin;max-width:64vmin}
  .tblGrid h4{font-family:'Alfa Slab One',serif;color:var(--gold);font-size:2.8vmin;margin:0 0 .8vmin;font-weight:normal}
  .tblGrid .pairRow{font-size:2.6vmin}
  .champBanner{font-family:'Alfa Slab One',serif;color:var(--gold);font-size:6vmin;margin-top:1.6vmin;text-shadow:0 .4vmin 1.2vmin rgba(0,0,0,.55)}
  #tHead{position:fixed;top:1.6vmin;left:0;right:0;display:none;align-items:flex-start;
    justify-content:space-between;padding:0 2.4vmin;z-index:1}
  #tHead img.crest{height:22vmin;filter:drop-shadow(0 .5vmin 1vmin rgba(0,0,0,.45))}
  #tHead .mid{text-align:center;padding-top:1vmin}
  #tHead .clock{font-family:'Alfa Slab One',serif;font-size:4.2vmin;line-height:1.05;color:var(--cream);text-shadow:0 .3vmin .8vmin rgba(0,0,0,.5)}
  #tHead .datewx{font-size:2.2vmin;font-weight:800;opacity:.92;margin-top:.5vmin;text-shadow:0 .2vmin .6vmin rgba(0,0,0,.5)}
  #tHead img.evimg{height:16vmin;max-width:24vw;object-fit:cover;border:.4vmin solid var(--gold);border-radius:1.4vmin}
  .bigclock{font-family:'Alfa Slab One',serif;font-size:21vmin;color:var(--gold);line-height:1;letter-spacing:.02em;
    text-shadow:0 .6vmin 1.6vmin rgba(0,0,0,.55)}
  .bigclock.hot{color:var(--red)}
  .bigclock.paused{opacity:.55}
  .tlabel{font-size:5.2vmin;font-weight:800;margin-top:1vmin;text-shadow:0 .3vmin .9vmin rgba(0,0,0,.5)}
  .tev{font-family:'Caveat',cursive;font-size:4vmin;opacity:.9;margin-top:1vmin;text-shadow:0 .2vmin .6vmin rgba(0,0,0,.5)}
  #schedPanel{position:fixed;right:2.4vmin;top:26vmin;width:26vw;max-height:60vh;overflow:hidden;z-index:1;
    background:rgba(20,34,24,.72);border:.35vmin solid var(--gold-dk);border-radius:1.6vmin;padding:1.6vmin 1.8vmin;display:none}
  #pairPanel{position:fixed;left:2.4vmin;top:26vmin;width:26vw;max-height:60vh;overflow:hidden;z-index:1;
    background:rgba(20,34,24,.72);border:.35vmin solid var(--gold-dk);border-radius:1.6vmin;padding:1.6vmin 1.8vmin;display:none}
  #pairPanel h4{font-family:'Alfa Slab One',serif;color:var(--gold);font-size:2.6vmin;margin:0 0 1vmin;font-weight:normal}
  .pairRow{display:flex;gap:1vmin;font-size:2.35vmin;font-weight:800;padding:.55vmin .9vmin;align-items:baseline}
  .pairRow .tno{font-family:'Alfa Slab One',serif;color:var(--gold);min-width:4.2vmin}
  .pairRow .done{opacity:.5;text-decoration:line-through}
  .standRow{display:flex;gap:1vmin;font-size:2.5vmin;font-weight:800;padding:.55vmin .9vmin}
  .standRow .pos{font-family:'Alfa Slab One',serif;color:var(--gold);min-width:4vmin}
  .standRow .pts{margin-left:auto;font-family:'Alfa Slab One',serif;color:var(--gold)}
  #schedPanel h4{font-family:'Alfa Slab One',serif;color:var(--gold);font-size:2.6vmin;margin:0 0 1vmin;font-weight:normal}
  .schedRow{display:flex;justify-content:space-between;gap:1vmin;font-size:2.5vmin;font-weight:800;
    padding:.7vmin .9vmin;border-radius:.9vmin;opacity:.65}
  .schedRow .dur{font-family:'Alfa Slab One',serif;color:var(--gold)}
  .schedRow.done{opacity:.35;text-decoration:line-through}
  .schedRow.cur{opacity:1;background:var(--gold);color:var(--ink)}
  .schedRow.cur .dur{color:var(--maroon)}
  .rosterWrap{display:flex;flex-wrap:wrap;gap:1vmin 3vmin;justify-content:center;max-width:86vw;margin-top:2.5vmin}
  .rosterName{font-size:3.1vmin;font-weight:800;text-shadow:0 .2vmin .6vmin rgba(0,0,0,.5)}
  .rosterName.ghost{opacity:.38;font-weight:400}
  .rosterName .tbl{color:var(--gold);font-size:2.2vmin;margin-left:.6vmin}
/* ---- Reflex Rally big-screen overlay (NGH-BUILD 2026-08-24c) ---- */
#mgStage{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;
  justify-content:center;background:radial-gradient(110vmax 80vmax at 50% 35%, #24503a 0%, var(--forest-dk,#132a1d) 68%);
  color:var(--cream,#f6efdd)}
#mgStage.on{display:flex}
#mgsTitle{font-family:'Alfa Slab One',serif;color:var(--gold-lt,#e8b84b);font-size:7vmin}
#mgsSub{font-weight:800;font-size:2.8vmin;opacity:.9}
#mgsClock{font-family:'Alfa Slab One',serif;font-size:14vmin;color:var(--gold-lt,#e8b84b);line-height:1;min-height:1em}
#mgsClock.count{font-size:24vmin;color:#8dffb8}
#mgsBarWrap{width:84vw;margin:3vmin 0 1vmin}
#mgsTrack{position:relative;height:11vmin;border-radius:2.4vmin;border:.7vmin solid var(--gold,#c9973a);overflow:hidden;
  background:linear-gradient(90deg,
    #5a1f28 0%,#5a1f28 30%, #c9973a 30%,#c9973a 38%, #e8b84b 38%,#e8b84b 45%,
    #3fbf6f 45%,#3fbf6f 55%, #e8b84b 55%,#e8b84b 62%, #c9973a 62%,#c9973a 70%,
    #5a1f28 70%,#5a1f28 100%)}
#mgsCur{position:absolute;top:-1vmin;bottom:-1vmin;width:1.3vmin;left:0;background:#f6efdd;
  border-radius:.8vmin;box-shadow:0 0 2vmin rgba(0,0,0,.7)}
#mgsMeta{display:flex;gap:5vmin;font-size:2.6vmin;font-weight:800;color:var(--gold-lt,#e8b84b)}
#mgsBoard{position:absolute;right:2.5vmin;top:2.5vmin;bottom:2.5vmin;width:26vmin;overflow:hidden;
  font-size:2.3vmin;font-weight:800;text-align:left}
#mgsBoard h3{font-family:'Alfa Slab One',serif;color:var(--gold,#c9973a);font-size:2.6vmin;margin:0 0 1vmin}
#mgsBoard .r{display:flex;justify-content:space-between;padding:.5vmin 0;border-bottom:1px solid rgba(201,151,58,.35)}
#mgsBoard .r span:last-child{color:var(--gold-lt,#e8b84b)}
#mgsPod{display:flex;flex-direction:column;gap:1.2vmin;min-width:52vmin;margin-top:2vmin}
#mgsPod .r{display:flex;justify-content:space-between;gap:4vmin;background:var(--forest,#1e3d2b);
  border:.5vmin solid var(--gold,#c9973a);border-radius:1.6vmin;padding:1.2vmin 2.4vmin;font-size:3.4vmin;font-weight:800}
#mgsPod .r.first{border-color:var(--gold-lt,#e8b84b);background:#2a5a3f;font-size:4.2vmin}
#mgsPod .r span:last-child{color:var(--gold-lt,#e8b84b)}
#mgConfetti{position:fixed;inset:0;z-index:90;pointer-events:none;display:none}
/* ---- Tournament TV suite (NGH-BUILD 2026-08-24f) ---- */
#tourStage{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;
  background:radial-gradient(120vmax 80vmax at 50% 25%, #24503a, var(--forest-dk,#132a1d) 70%);
  color:var(--cream,#f6efdd);padding:3vmin 3.5vmin}
#tourStage.on{display:flex}
#tourHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.6vmin}
#tourTitle{font-family:'Alfa Slab One',serif;color:var(--gold-lt,#e8b84b);font-size:5vmin;
  max-width:72%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#tourClock{font-family:'Alfa Slab One',serif;font-size:4.6vmin;color:var(--cream,#f6efdd);
  background:var(--maroon,#7a2431);border-radius:1.4vmin;padding:.6vmin 2.4vmin}
#tourBody{flex:1;position:relative;overflow:hidden}
#tourBody::after{content:"";position:absolute;right:-5vmin;bottom:-7vmin;width:48vmin;height:48vmin;
  background:url('/brand/stash-fullbody.png') center/contain no-repeat;opacity:.055;pointer-events:none}
.tourGridStand{display:grid;grid-template-columns:1fr 1fr;gap:1.2vmin 4vmin;align-content:start}
.tsRow{display:flex;align-items:center;gap:1.6vmin;font-size:3.1vmin;font-weight:800;
  border-bottom:1px solid rgba(201,151,58,.35);padding:.7vmin 0}
.tsRow .pos{color:var(--gold,#c9973a);min-width:5vmin;text-align:right}
.tsRow .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tsRow .rec{opacity:.75;font-size:2.3vmin}
.tsRow .pts{color:var(--gold-lt,#e8b84b);min-width:6vmin;text-align:right}
.tsRow .mv{min-width:6vmin;font-size:2.4vmin;text-align:center}
.mv.up{color:#7fe0a4}.mv.dn{color:#ff9b8a}.mv.same{opacity:.35}
.tsRow.drop{opacity:.45;text-decoration:line-through}
.tourGridPair{display:grid;grid-template-columns:1fr 1fr;gap:1.4vmin 4vmin;align-content:start}
.tpRow{display:flex;align-items:center;gap:1.8vmin;font-size:3.2vmin;font-weight:800;
  background:rgba(19,42,29,.55);border:.4vmin solid var(--gold,#c9973a);border-radius:1.4vmin;
  padding:1vmin 1.8vmin}
.tpRow .tno{font-family:'Alfa Slab One',serif;color:var(--gold-lt,#e8b84b);min-width:9vmin}
.tpRow span:last-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.tpRow.done{opacity:.55}
.tourMapBox{position:absolute;inset:0}
.tmStage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.tmTable{position:absolute;background:#3a6b4e;border:5px solid var(--gold,#c9973a);
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.tmTable.round{border-radius:50%}
.tmTable.rect{border-radius:16px}
.tmTable.live{border-color:var(--gold-lt,#e8b84b);box-shadow:0 0 34px rgba(232,184,75,.5)}
.tmTable.done{opacity:.55}
.tmNo{font-family:'Alfa Slab One',serif;color:var(--gold-lt,#e8b84b);font-size:40px;line-height:1}
.tmNames{font-size:23px;font-weight:800;text-align:center;padding:0 8px;line-height:1.15;
  max-height:62%;overflow:hidden}
.tmSeat{position:absolute;width:26px;height:26px;border-radius:50%;background:#c9973a;
  border:3px solid #132a1d}
.tmLabel{position:absolute;font-weight:800;color:var(--cream,#f6efdd);opacity:.85}
.tmWall{position:absolute;background:rgba(201,151,58,.45);border-radius:6px}
.brWrap{position:absolute;inset:0;display:flex;gap:3vmin;align-items:stretch;overflow:hidden}
.brCol{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:1.2vmin}
.brColH{font-family:'Alfa Slab One',serif;color:var(--gold,#c9973a);font-size:2.6vmin;text-align:center}
.brM{background:rgba(19,42,29,.6);border:.35vmin solid var(--gold,#c9973a);border-radius:1.2vmin;
  padding:.8vmin 1.4vmin;font-size:2.5vmin;font-weight:800}
.brM .w{color:var(--gold-lt,#e8b84b)}
.brCol.dense .brM{font-size:1.75vmin;padding:.4vmin .9vmin;border-width:.25vmin}
.brM{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.brM .l{opacity:.55}
.brChamp{align-self:center;background:var(--maroon,#7a2431);border-radius:1.6vmin;
  padding:2vmin 3vmin;font-size:3.6vmin;font-weight:800;text-align:center}
.tourPromo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5vmin;padding:4vmin}
.tourPromo img.art{max-width:46%;max-height:80%;border-radius:2vmin;
  filter:drop-shadow(0 12px 30px rgba(0,0,0,.5))}
.tourPromoTxt{max-width:52%}
.tourPromoTxt .big{font-family:'Alfa Slab One',serif;color:var(--gold-lt,#e8b84b);font-size:7vmin;
  line-height:1.1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tourPromoTxt .sub{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tourPromoTxt .sub{font-size:3.4vmin;font-weight:800;margin-top:1.6vmin}
#promoTicker{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;
  background:rgba(19,42,29,.92);border-top:.5vmin solid var(--gold,#c9973a);
  padding:1.1vmin 3vmin;font-size:2.8vmin;font-weight:800;text-align:center}
#promoTicker b{color:var(--gold-lt,#e8b84b)}
</style>
</head>
<body>
<div id="mgStage">
  <div id="mgsTitle">🎯 REFLEX RALLY</div>
  <div id="mgsSub">Tap on your phone when the bar hits the green center — one tap per sweep!</div>
  <div id="mgsClock">–</div>

  <div class="mid">
    <div class="clock" id="tClock">--:--</div>
    <div class="datewx" id="tDateWx"></div>

<script>
/* =====================================================================
   NGH TRIVIA DISPLAY — NGH-BUILD 09e
   Dumb, resilient TV client.
   URL: trivia-display.html?game=GAME-XXXX&display=Retail
   - Server clock offset: median of ping samples against /api/trivia/time
   - Polls /api/trivia/games/:id/state?v=N every 1s (tiny "unchanged" reply)
   - PRELOAD phase: fetches media into Cache Storage, heartbeats ready ✓
   - LIVE phase: media playback scheduled at state.startAt (server epoch ms)
     with post-start drift correction against the shared clock
   - Heartbeat every 5s; obeys remote refresh command
   - Media plays MUTED by default (audio rides the host mixer chain);
     game setting tvAudio=true unmutes for TV-speaker fallback mode
   ===================================================================== */
(function () {
  "use strict";
  var API = "/api/trivia";
  var params = new URLSearchParams(location.search);
  var GAME = params.get("game") || "";
  var DISPLAY = params.get("display") || ("TV-" + Math.floor(Math.random() * 1000));

  var stage = document.getElementById("stage");
  var overlay = document.getElementById("overlay");
  var overlayMsg = document.getElementById("overlayMsg");
  var roundTag = document.getElementById("roundTag");
  var wagerTag = document.getElementById("wagerTag");
  var timerEl = document.getElementById("timer");
  var fsBtn = document.getElementById("fsBtn");

  if (!GAME) {
    stage.innerHTML = '<div class="brand" style="font-size:6vmin">Missing ?game= parameter</div>';
    return;
  }

  /* ------------------ clock sync ------------------ */
  var offsets = [];        // serverNow - localMidpoint samples
  var clockOffset = 0;     // median
  function median(a) {
    if (!a.length) return 0;
    var s = a.slice().sort(function (x, y) { return x - y; });
    return s[Math.floor(s.length / 2)];
  }
  function pingOnce() {
    var t0 = Date.now();
    return fetch(API + "/time").then(function (r) { return r.json(); }).then(function (j) {
      var t1 = Date.now();
      if (t1 - t0 > 800) return; // discard slow samples
      offsets.push(j.now - (t0 + t1) / 2);
      if (offsets.length > 15) offsets.shift();
      clockOffset = median(offsets);
    }).catch(function () {});
  }
  function serverNow() { return Date.now() + clockOffset; }
  function syncClock(n) {
    var p = Promise.resolve();
    for (var i = 0; i < n; i++) p = p.then(pingOnce);
    return p;
  }

  /* ------------------ media cache ------------------ */
  var CACHE = "ngh-trivia-v1";
  var blobUrls = {}; // url -> objectURL
  function preloadAsset(url) {
    if (!url) return Promise.resolve(null);
    if (blobUrls[url]) return Promise.resolve(blobUrls[url]);
    function toBlobUrl(resp) {
      return resp.blob().then(function (b) {
        blobUrls[url] = URL.createObjectURL(b);
        return blobUrls[url];
      });
    }
    if (window.caches) {
      return caches.open(CACHE).then(function (c) {
        return c.match(url).then(function (hit) {
          if (hit) return toBlobUrl(hit);
          return fetch(url).then(function (resp) {
            if (!resp.ok) throw new Error("fetch " + resp.status);
            return c.put(url, resp.clone()).then(function () { return toBlobUrl(resp); });
          });
        });
      }).catch(function () {
        return fetch(url).then(toBlobUrl);
      });
    }
    return fetch(url).then(toBlobUrl).catch(function () { return url; });
  }

  /* ------------------ state ------------------ */
  var v = 0;                 // last seen version
  var st = null;             // last state payload
  var readyQKey = "";        // asset-preloaded question key
  var lastCmdSeq = Number(localStorage.getItem("ngh_trivia_cmdseq_" + DISPLAY) || 0);
  var failCount = 0;
  var mediaEl = null;
  var driftTimer = null;
  var playTimeout = null;
  var countdownTimer = null;

  function setOverlay(show, msg) {
    overlay.style.display = show ? "flex" : "none";
    if (msg) overlayMsg.textContent = msg;
  }

  function poll() {
    fetch(API + "/games/" + encodeURIComponent(GAME) + "/state?v=" + v)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        failCount = 0;
        setOverlay(false);
        // opportunistic clock sample from every poll's serverNow is too noisy
        // (payload timing varies); dedicated pings handle the clock.
        if (j.unchanged) return;
        v = j.v; st = j;
        render();
      })
      .catch(function () {
        failCount++;
        if (failCount >= 3) setOverlay(true, "Reconnecting…");
      });
  }

  function heartbeat() {
    fetch(API + "/games/" + encodeURIComponent(GAME) + "/heartbeat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        displayId: DISPLAY, name: DISPLAY,
        ready: !!readyQKey && !!st && !!st.q && readyQKey === st.q.key,
        qKeyReady: readyQKey, lastCmdSeq: lastCmdSeq
      })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.cmd && j.cmd.seq > lastCmdSeq) {
        lastCmdSeq = j.cmd.seq;
        localStorage.setItem("ngh_trivia_cmdseq_" + DISPLAY, String(lastCmdSeq));
        if (j.cmd.action === "refresh") location.reload();
      }
    }).catch(function () {});
  }

  /* ------------------ rendering ------------------ */
  function clearTimers() {
    if (driftTimer) { clearInterval(driftTimer); driftTimer = null; }
    if (playTimeout) { clearTimeout(playTimeout); playTimeout = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    mediaEl = null;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function tags() {
    if (st.round && st.round.title && ["live", "answering", "locked", "reveal", "preload"].indexOf(st.phase) >= 0) {
      roundTag.textContent = "Round " + (st.roundIdx + 1) + " · " + st.round.title +
        " · Q" + (st.qIdx + 1) + "/" + st.round.qCount;
      roundTag.style.display = "block";
    } else roundTag.style.display = "none";
    if (st.round && st.round.isWager && st.phase !== "lobby" && st.phase !== "scoreboard") {
      wagerTag.textContent = "💰 " + st.wagerLabel;
      wagerTag.style.display = "block";
    } else wagerTag.style.display = "none";
  }

  function startCountdown() {
    timerEl.style.display = "none";
    if (!st.deadline) return;
    countdownTimer = setInterval(function () {
      var left = Math.ceil((Number(st.deadline) - serverNow()) / 1000);
      if (left <= 0) {
        timerEl.textContent = "0";
        timerEl.classList.add("hot");
        clearInterval(countdownTimer); countdownTimer = null;
        return;
      }
      timerEl.textContent = String(left);
      timerEl.classList.toggle("hot", left <= 10);
      timerEl.style.display = "block";
    }, 200);
  }

  function scheduleMedia(el, kind) {
    // Play precisely at st.startAt (server epoch ms) on the shared clock,
    // then correct drift so three rooms stay lip-sync tight.
    el.muted = !(st.settings && st.settings.tvAudio);
    var fire = function () {
      var lateBy = (serverNow() - Number(st.startAt)) / 1000;
      try { if (lateBy > 0.25) el.currentTime = lateBy; } catch (e) {}
      el.play().catch(function () {});
    };
    var delay = Number(st.startAt) - serverNow();
    if (delay > 30) playTimeout = setTimeout(fire, delay);
    else fire();
    if (kind !== "image") {
      driftTimer = setInterval(function () {
        if (!el.duration || el.paused) return;
        var expected = (serverNow() - Number(st.startAt)) / 1000;
        if (expected > el.duration) { clearInterval(driftTimer); driftTimer = null; return; }
        if (Math.abs(el.currentTime - expected) > 0.15) {
          try { el.currentTime = expected; } catch (e) {}
        }
      }, 3000);
    }
  }

  /* ---------- YouTube clue player (NGH-BUILD 09e) ---------- */
  var ytPlayer = null, ytReady = false, ytPending = null, ytStopTimer = null;
  function loadYT() {
    if (window.YT && window.YT.Player) { ytReady = true; return; }
    if (document.getElementById("ytapi")) return;
    var t = document.createElement("script");
    t.id = "ytapi"; t.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(t);
    window.onYouTubeIframeAPIReady = function () {
      ytReady = true;
      if (ytPending) { var p = ytPending; ytPending = null; ytMount(p.m, p.play); }
    };
  }
  loadYT();
  function ytMount(m, playNow) {
    if (!ytReady) { ytPending = { m: m, play: playNow }; return; }
    var host = document.getElementById("ytHost");
    if (!host) return;
    var opts = {
      videoId: m.videoId,
      playerVars: {
        autoplay: 0, controls: 0, disablekb: 1, modestbranding: 1, rel: 0,
        fs: 0, iv_load_policy: 3, playsinline: 1,
        start: m.start || 0
      },
      events: {
        onReady: function (e) {
          try { if (!(st.settings && st.settings.tvAudio)) e.target.mute(); } catch (x) {}
          if (playNow) ytPlayAt(m);
        }
      }
    };
    try { if (ytPlayer && ytPlayer.destroy) ytPlayer.destroy(); } catch (x) {}
    ytPlayer = new YT.Player(host, opts);
  }
  function ytPlayAt(m) {
    if (!ytPlayer || !ytPlayer.seekTo) return;
    clearTimeout(ytStopTimer);
    var startAt = Number(st.startAt) || serverNow();
    var go = function () {
      var lateBy = Math.max(0, (serverNow() - startAt) / 1000);
      try {
        ytPlayer.seekTo((m.start || 0) + lateBy, true);
        ytPlayer.playVideo();
      } catch (x) {}
      if (m.end) {
        var runMs = Math.max(500, ((m.end - (m.start || 0)) - lateBy) * 1000);
        ytStopTimer = setTimeout(function () { try { ytPlayer.pauseVideo(); } catch (x) {} }, runMs);
      }
    };
    var delay = startAt - serverNow();
    if (delay > 30) setTimeout(go, delay); else go();
  }
  function ytStop() {
    clearTimeout(ytStopTimer);
    try { if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo(); } catch (x) {}
  }

  function mediaBlock(q, ph) {
    if (!q || !q.media || !q.media.url) return Promise.resolve("");
    if (q.media.kind === "youtube") {
      readyQKey = q.key;
      if (ph === "preload") { return Promise.resolve(""); }
      return Promise.resolve(
        '<div id="ytWrap"' + (q.media.hideVideo ? ' class="audioonly"' : "") + '>' +
        '<div id="ytHost"></div>' +
        '<div id="ytCover">🎵<div style="font-size:4vmin;margin-top:1vmin">LISTEN…</div></div>' +
        '<div id="ytBlock"></div></div>');
    }
    function renderSrc(src) { // 10a
      if (ph === "preload") return "";
      if (q.media.kind === "image") return '<img class="clue" id="clueMedia" src="' + src + '">';
      if (q.media.kind === "audio") return '<audio id="clueMedia" src="' + src + '" preload="auto"></audio>' +
        '<div class="brand" style="font-size:9vmin;margin:3vmin 0">🎵 LISTEN…</div>';
      return '<video id="clueMedia" src="' + src + '" preload="auto" playsinline></video>';
    }
    return preloadAsset(q.media.url).then(function (src) {
      readyQKey = q.key;
      return renderSrc(src);
    }).catch(function () {
      // 10a: cache/CORS fetch failed — fall back to the raw URL. An <img>/<video>
      // tag renders cross-origin fine even when fetch() can't; the question must
      // NEVER be held hostage by a clue that won't load.
      readyQKey = q.key;
      return renderSrc(q.media.url);
    });
  }

  /* ------------------ weather (Chippewa Falls, WI) — NGH-BUILD 08a ------------------ */
  var wx = { cond: "clear", night: false, temp: null, desc: "" };
  var wxBuiltFor = "";
  function wxCondFromCode(c) {
    if (c === 0 || c === 1) return "clear";
    if (c === 2 || c === 3 || c === 45 || c === 48) return "cloudy";
    if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return "rain";
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "snow";
    if (c >= 95) return "storm";
    return "cloudy";
  }
  function wxDesc(cond, night) {
    return { clear: night ? "Clear night" : "Sunny", cloudy: "Cloudy", rain: "Rain", snow: "Snow", storm: "Thunderstorms" }[cond] || "";
  }
  function fetchWeather() {
    fetch("https://api.open-meteo.com/v1/forecast?latitude=44.937&longitude=-91.393&current=temperature_2m,weather_code,is_day&temperature_unit=fahrenheit")
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var c = j && j.current;
        if (!c) return;
        wx.cond = wxCondFromCode(Number(c.weather_code));
        wx.night = !Number(c.is_day);
        wx.temp = Math.round(Number(c.temperature_2m));
        wx.desc = wxDesc(wx.cond, wx.night);
        applyWeather();
      }).catch(function () {});
  }
  function clearWxLayer() {
    var layer = document.getElementById("wxLayer");
    Array.prototype.slice.call(layer.querySelectorAll(".drop,.flake,.cloud,.star")).forEach(function (n) { n.remove(); });
  }
  function applyWeather() {
    if (!st || st.kind !== "timer") return;
    var key = wx.cond + (wx.night ? "-night" : "-day");
    document.body.className = "wx wx-" + key;
    document.getElementById("sunGlow").style.display = (wx.cond === "clear" && !wx.night) ? "block" : "none";
    document.getElementById("moon").style.display = (wx.cond === "clear" && wx.night) ? "block" : "none";
    if (wxBuiltFor === key) return;
    wxBuiltFor = key;
    clearWxLayer();
    var layer = document.getElementById("wxLayer");
    var i, el;
    if (wx.night && (wx.cond === "clear" || wx.cond === "cloudy")) {
      for (i = 0; i < 60; i++) {
        el = document.createElement("div"); el.className = "star";
        el.style.left = (Math.random() * 100) + "vw";
        el.style.top = (Math.random() * 55) + "vh";
        el.style.animationDelay = (Math.random() * 3) + "s";
        layer.appendChild(el);
      }
    }
    if (wx.cond === "cloudy" || wx.cond === "storm" || wx.cond === "rain") {
      for (i = 0; i < 5; i++) {
        el = document.createElement("div"); el.className = "cloud";
        var w = 18 + Math.random() * 20;
        el.style.width = w + "vmin"; el.style.height = (w * 0.34) + "vmin";
        el.style.top = (3 + Math.random() * 22) + "vh";
        el.style.animationDuration = (60 + Math.random() * 80) + "s";
        el.style.animationDelay = (-Math.random() * 90) + "s";
        layer.appendChild(el);
      }
    }
    if (wx.cond === "rain" || wx.cond === "storm") {
      for (i = 0; i < 90; i++) {
        el = document.createElement("div"); el.className = "drop";
        el.style.left = (Math.random() * 100) + "vw";
        el.style.animationDuration = (0.55 + Math.random() * 0.5) + "s";
        el.style.animationDelay = (Math.random() * 1.2) + "s";
        layer.appendChild(el);
      }
    }
    if (wx.cond === "snow") {
      for (i = 0; i < 55; i++) {
        el = document.createElement("div"); el.className = "flake"; el.textContent = "❄";
        el.style.left = (Math.random() * 100) + "vw";
        el.style.fontSize = (1 + Math.random() * 1.6) + "vmin";
        el.style.animationDuration = (6 + Math.random() * 8) + "s";
        el.style.animationDelay = (Math.random() * 8) + "s";
        layer.appendChild(el);
      }
    }
  }
  var stormTimer = setInterval(function () {
    if (wx.cond !== "storm" || !st || st.kind !== "timer") return;
    if (Math.random() < 0.28) {
      var f = document.getElementById("flash");
      f.style.opacity = 0.75;
      setTimeout(function () { f.style.opacity = 0; }, 90);
      setTimeout(function () { f.style.opacity = 0.4; }, 200);
      setTimeout(function () { f.style.opacity = 0; }, 290);
    }
  }, 5000);
  function tickClock() {
    if (!st || st.kind !== "timer") return;
    var d = new Date();
    var hh = d.getHours() % 12 || 12, mm = String(d.getMinutes()).padStart(2, "0");
    document.getElementById("tClock").textContent = hh + ":" + mm + (d.getHours() >= 12 ? " PM" : " AM");
    var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    var mons = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    document.getElementById("tDateWx").textContent =
      days[d.getDay()] + ", " + mons[d.getMonth()] + " " + d.getDate() +
      (wx.temp != null ? ("  ·  " + wx.temp + "°F " + wx.desc) : "");
  }
  setInterval(tickClock, 1000);
  setInterval(fetchWeather, 10 * 60 * 1000);
  fetchWeather();

  /* ------------------ roster (idle screen) ------------------ */
  var roster = null, rosterTimer = null;
  function pollRoster() {
    fetch(API + "/games/" + encodeURIComponent(GAME) + "/roster")
      .then(function (r) { return r.json(); })
      .then(function (j) { roster = j; if (st && st.kind === "timer" && st.phase === "lobby") renderTimerMode(); })
      .catch(function () {});
  }

  function fmtDur(secs) {
    var m = Math.floor(secs / 60), s = secs % 60;
    return m + ":" + String(s).padStart(2, "0");
  }
  function schedPanelHTML(doneThrough, curIdx, curIcon) {
    if (!st.schedule || !st.schedule.length) return "";
    var h = "<h4>ROUND SCHEDULE</h4>";
    st.schedule.forEach(function (r, i) {
      var cls = i === curIdx ? "cur" : (doneThrough != null && i <= doneThrough ? "done" : "");
      var icon = (i === curIdx && curIcon) ? (curIcon + " ") : "";
      h += '<div class="schedRow ' + cls + '"><span>' + icon + (i + 1) + ". " + esc(r.label || ("Round " + (i + 1))) + "</span>" +
        '<span class="dur">' + fmtDur(r.secs) + "</span></div>";
    });
    return h;
  }

  function leftPanelHTML() {
    // ALWAYS-ON standings panel (left side)
    var h = "";
    if (st.champion && st.champion.name) {
      h += '<h4>\ud83c\udfc6 CHAMPION</h4><div class="standRow" style="font-size:3vmin"><span>' + esc(st.champion.name) + "</span></div>";
    }
    h += "<h4>STANDINGS</h4>";
    if (!st.standings || !st.standings.length) {
      h += '<div class="standRow" style="opacity:.6">Pending \u2014 updates after the first results</div>';
      return h;
    }
    st.standings.slice(0, 12).forEach(function (s2) {
      h += '<div class="standRow"><span class="pos">' + s2.standing + '.</span><span>' + esc(s2.name) + '</span><span class="pts">' + s2.pts + "</span></div>";
    });
    return h;
  }
  function tablesBlockHTML() {
    // Table assignments — shown on intermission / waiting / idle center stage
    var h = '<div class="tblGrid"><h4>TABLE ASSIGNMENTS' + ((st.pairings && st.pairings.length) ? (" \u2014 ROUND " + st.pairRound) : "") + "</h4>";
    if (!st.pairings || !st.pairings.length) {
      h += '<div class="pairRow" style="opacity:.6">Pending \u2014 the Guru is pairing tables</div></div>';
      return h;
    }
    var max = 10;
    st.pairings.slice(0, max).forEach(function (m) {
      h += '<div class="pairRow"><span class="tno">T' + esc(String(m.table)) + '</span><span class="' + (m.result ? "done" : "") + '">' +
        esc(m.aName) + (m.bName ? " vs " + esc(m.bName) : " \u2014 BYE") + "</span></div>";
    });
    if (st.pairings.length > max) h += '<div class="pairRow"><span class="tno">\u2026</span><span>+' + (st.pairings.length - max) + " more</span></div>";
    h += "</div>";
    return h;
  }

  /* ============ Tournament TV suite (24e): view rotation, floor map,
     bracket, full standings, promos ============ */
  var tourRotT = null, tourViewIdx = 0, tourPage = 0, tourPromoIdx = 0, tickerT = null, tickerIdx = 0;
  var tourClkT = null;
  var mapCache = {}, mapWant = "";
  function tourEl(id){ return document.getElementById(id); }
  function tourAvail(){
    var a = ["schedule"];
    if (st.pairings && st.pairings.length) a.push("pairings");
    if (st.standings && st.standings.length) a.push("standings");
    if (st.mapId && st.pairings && st.pairings.length) a.push("map");
    if ((st.allRounds||[]).some(function(r){ return r.mode==="single-elim"; })) a.push("bracket");
    if (st.promos && st.promos.length) a.push("promo");
    return a;
  }
  function fetchMap(id){
    if (mapCache[id]) return Promise.resolve(mapCache[id]);
    return fetch("/api/tv/floormaps/"+encodeURIComponent(id))
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){ mapCache[id]=j; return j; });
  }
  function tourClockTxt(){
    function fmt(ms){ var s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);
      return m+":"+String(s%60).padStart(2,"0"); }
    if (st.phase==="timer-paused") return "⏸ "+fmt(st.remainMs||0);
    if (st.deadline){
      var left = Number(st.deadline)-serverNow();
      if (left <= 0 && st.intMs) return "☕ next round soon";
      return fmt(left);
    }
    return st.timerLabel ? esc(st.timerLabel) : "—";
  }
  function drawMapHTML(mapj){
    // pairing lookup by table number for the CURRENT round
    var byT = {};
    (st.pairings||[]).forEach(function(m){ byT[String(m.table)] = m; });
    var h = '<div class="tmStage" id="tmStage">';
    (mapj.els||[]).forEach(function(e){
      var box = 'left:'+e.x+'px;top:'+e.y+'px;width:'+e.w+'px;height:'+e.h+'px;';

  /* ---------------- Reflex Rally overlay ---------------- */
  var MGC = { d0: 2000, f: 0.93, min: 700 };
  function mgSweepAt(tms) {
    var t = tms, i = 0, d = MGC.d0;
    while (t >= d) { t -= d; i++; d = Math.max(MGC.min, Math.round(MGC.d0 * Math.pow(MGC.f, i))); }
    return { sweep: i, x: t / d, dur: d };
  }
  var mgRaf = null, mgLastSweep = -1, mgLastCount = -1, mgConfettiDone = false, mgCurId = null;
  var mgAC = null;
  function mgAudioOn() { return !!(st && st.settings && st.settings.tvAudio); }
  function mgBeep(freq, ms, vol) {
    if (!mgAudioOn()) return;
    try {
      if (!mgAC) mgAC = new (window.AudioContext || window.webkitAudioContext)();
      var o = mgAC.createOscillator(), g = mgAC.createGain();
      o.frequency.value = freq; o.type = "square";
      g.gain.value = vol || 0.12;
      o.connect(g); g.connect(mgAC.destination);
      var t0 = mgAC.currentTime;
      o.start(t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + ms / 1000);
      o.stop(t0 + ms / 1000 + 0.02);
    } catch (e) {}
  }
  function mgStop() {

  function mgConfettiBurst() {
    var cv = document.getElementById("mgConfetti"), ctx = cv.getContext("2d");
    cv.width = innerWidth; cv.height = innerHeight; cv.style.display = "block";
    var cols = ["#e8b84b", "#c9973a", "#3fbf6f", "#f6efdd", "#7a2431"], ps = [];
    for (var i = 0; i < 140; i++) ps.push({
      x: cv.width / 2, y: cv.height * 0.35,
      vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 12 - 4,
      s: 6 + Math.random() * 8, c: cols[i % cols.length], r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4
    });
    var frames = 0;
    (function fall() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      for (var i = 0; i < ps.length; i++) {
        var q = ps[i]; q.x += q.vx; q.y += q.vy; q.vy += 0.35; q.r += q.vr;
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r);
        ctx.fillStyle = q.c; ctx.fillRect(-q.s / 2, -q.s / 2, q.s, q.s * 0.6); ctx.restore();
      }
      if (++frames < 140) requestAnimationFrame(fall);
      else cv.style.display = "none";
    })();
  }
  function mgFrame() {
    var mg = st && st.mg;
    if (!mg) { mgStop(); return; }
    var rel = serverNow() - Number(mg.startAt);
    var clock = document.getElementById("mgsClock");
    if (mg.phase === "scored") {
      clock.className = ""; clock.textContent = "🏆 POINTS AWARDED";
    } else if (rel < 0) {
      var c = Math.ceil(-rel / 1000);
      clock.className = "count"; clock.textContent = c;
      if (c !== mgLastCount) { mgLastCount = c; mgBeep(880, 90); }
      document.getElementById("mgsCur").style.left = "0%";
    } else if (rel <= Number(mg.dur)) {
      if (mgLastCount !== -99) { mgLastCount = -99; mgBeep(1320, 350, 0.16); } // GO!
      var s = mgSweepAt(rel);
      document.getElementById("mgsCur").style.left = (s.x * 100) + "%";
      clock.className = ""; clock.textContent = Math.ceil((Number(mg.dur) - rel) / 1000);
      document.getElementById("mgsSweep").textContent = "Sweep " + (s.sweep + 1);
      document.getElementById("mgsSpeed").textContent = "⚡ " + (MGC.d0 / s.dur).toFixed(1) + "× speed";
      if (s.sweep !== mgLastSweep) { mgLastSweep = s.sweep; if (s.sweep > 0) mgBeep(660, 40, 0.07); }

        (st.round ? '<div class="sub" style="font-size:6vmin;margin-top:2vmin">Category: ' + esc(st.round.title) + '</div>' : "") +
        '<div class="sub" style="font-size:4.2vmin;margin-top:3vmin">Stake your points on your phones — the question stays hidden until every stash is staked.</div>' +
        '<div class="brand" style="font-size:12vmin;margin-top:4vmin;color:var(--gold)">' + (st.wagersIn | 0) + '</div>' +
        '<div class="small">wager' + ((st.wagersIn | 0) === 1 ? "" : "s") + ' in</div>';
      startCountdown();
      return;
    }

    if (ph === "preload") {
      stage.innerHTML =
        '<div class="brand" style="font-size:7vmin">GET READY…</div>' +
        (st.round ? '<div class="sub" style="font-size:6vmin;margin-top:2vmin">Round ' + (st.roundIdx + 1) + ": " + esc(st.round.title) + '</div>' : "");
      if (st.q && st.q.media && st.q.media.url) {
        mediaBlock(st.q, "preload"); // fetch+cache; heartbeat flips ready ✓
      } else if (st.q) {
        readyQKey = st.q.key; // nothing to fetch — instantly ready
      }
      return;
    }

    if (ph === "live" || ph === "answering" || ph === "locked") {
      var q = st.q;
      mediaBlock(q, ph).then(function (mediaHtml) {
        var html = mediaHtml;
        html += '<div class="prompt" style="margin-top:2.5vmin">' + esc(q.prompt) + "</div>";
        if (q.choices && q.choices.length) {
          html += '<div class="choices">';
          for (var i = 0; i < q.choices.length; i++) {
            html += '<div class="choice"><b>' + "ABCDEFGH"[i] + '</b>' + esc(q.choices[i]) + "</div>";
          }
          html += "</div>";
        }
        if (ph === "locked") html += '<div class="sub" style="font-size:5vmin;margin-top:3.5vmin">🔒 Answers locked</div>';
        stage.innerHTML = html;
        var el = document.getElementById("clueMedia");
        if (el && el.tagName !== "IMG" && ph === "live" && st.startAt) scheduleMedia(el, q.media.kind);
        if (q.media && q.media.kind === "youtube" && document.getElementById("ytHost")) {
          ytMount(q.media, ph === "live" || ph === "answering");
        }
        if (ph !== "locked") startCountdown();
      }).catch(function () {
        // 10a: last-resort — show the question text even if media rendering throws
        stage.innerHTML = '<div class="prompt" style="margin-top:2.5vmin">' + esc(q.prompt || "") + "</div>";
        if (ph !== "locked") startCountdown();
      });
      return;
    }

    if (ph === "reveal") {
      var q2 = st.q;
      var html2 = '<div class="prompt">' + esc(q2.prompt) + "</div>";
      if (q2.choices && q2.choices.length) {
        html2 += '<div class="choices">';
        for (var j = 0; j < q2.choices.length; j++) {
          var win = normalizeLite(q2.choices[j]) === normalizeLite(q2.answer);
          html2 += '<div class="choice' + (win ? " win" : "") + '"><b>' + "ABCDEFGH"[j] + '</b>' + esc(q2.choices[j]) + "</div>";
        }
        html2 += "</div>";
      } else {
        html2 += '<div class="brand" style="font-size:7.5vmin;margin-top:4vmin;color:var(--gold)">' + esc(q2.answer) + "</div>";
      }
      stage.innerHTML = html2;
      return;
    }

    if (ph === "intermission") {
      var rows0 = st.scoreboard || [];
      var nx = st.next;
      var h = '<div class="devban">📵 Use of phones or devices to search for answers is STRICTLY PROHIBITED during the game</div>' +
        '<div class="brand" style="font-size:6.5vmin;margin-top:1vmin">☕ INTERMISSION</div>' +
        '<div class="intclock" id="intClock">–:––</div>';
      if (nx) {
        h += '<div class="sub" style="font-size:4.6vmin">Up next: Round ' + (nx.roundIdx + 1) +
          " — " + esc(nx.title) + (nx.isWager ? " 💰 " + esc(st.wagerLabel) : "") + "</div>";
      }
      h += '<div class="intgrid">';
      // standings panel
      h += '<div class="intpanel"><h4>📊 STANDINGS</h4>';
      if (!rows0.length) h += '<div class="introw" style="opacity:.6">Scores post after the first reveal</div>';
      for (var m = 0; m < Math.min(rows0.length, 10); m++) {
        h += '<div class="introw' + (m === 0 ? " cur" : "") + '"><span style="min-width:4vmin">' + (m + 1) + '.</span><span style="flex:1">' +
          esc(rows0[m].team) + '</span><span>' + rows0[m].score + "</span></div>";
      }
      h += "</div>";
      // upcoming rounds panel
      var outline = st.roundsOutline || [];
      if (outline.length) {
        var nxIdx = nx ? (nx.roundIdx | 0) : -1;
        h += '<div class="intpanel"><h4>🗺 ROUNDS</h4>';
        outline.forEach(function (r0, i0) {
          var cls = nxIdx >= 0 ? (i0 < nxIdx ? "done" : (i0 === nxIdx ? "cur" : "")) : "";
          h += '<div class="introw ' + cls + '"><span style="min-width:4vmin">' + (i0 + 1) + '.</span><span style="flex:1">' +
            esc(r0.title || ("Round " + (i0 + 1))) + (r0.isWager ? " 💰" : "") + "</span></div>";
        });
        h += "</div>";
      }
      h += "</div>";
      stage.innerHTML = h;
      // centered M:SS break clock off the shared deadline
      if (st.deadline) {
        countdownTimer = setInterval(function () {
          var el = document.getElementById("intClock");
          if (!el) return;
          var left = Math.max(0, Number(st.deadline) - serverNow());
          var sM = Math.floor(left / 60000), sS = Math.floor((left % 60000) / 1000);
          el.textContent = sM + ":" + String(sS).padStart(2, "0");
        }, 250);
      }
      return;
    }

    if (ph === "scoreboard" || ph === "ended") {
      var rows = st.scoreboard || [];
      var t = '<div class="brand" style="font-size:7vmin;margin-bottom:3vmin">' +
        (ph === "ended" ? "FINAL SCORES" : "SCOREBOARD") + "</div><table class='board'>";
      for (var k = 0; k < Math.min(rows.length, 12); k++) {
        t += "<tr" + (k === 0 ? ' class="gold"' : "") + "><td>" + (k + 1) + ".</td><td>" +
          esc(rows[k].team) + "</td><td>" + rows[k].score + "</td></tr>";
      }
      t += "</table>";
      if (!rows.length) t += '<div class="sub" style="font-size:5vmin">No scores yet</div>';
      stage.innerHTML = t;
      return;
    }
  }

  function normalizeLite(s) {
    return String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  }

  /* ------------------ fullscreen kiosk ------------------ */
  function tryFullscreen() {
    var el = document.documentElement;
    var f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f) { try { f.call(el); } catch (e) {} }
    fsBtn.style.display = "none";
  }
  document.addEventListener("fullscreenchange", function () {
    fsBtn.style.display = document.fullscreenElement ? "none" : "block";
  });
  fsBtn.addEventListener("click", tryFullscreen);
  // Kiosk browsers (Fully Kiosk etc.) are already fullscreen; on a normal
  // browser one tap anywhere enters fullscreen.
  fsBtn.style.display = "block";

  /* ------------------ boot ------------------ */
  setOverlay(true, "Connecting…");
  syncClock(5).then(function () {
    setOverlay(false);
    poll();
    setInterval(poll, 1000);
    heartbeat();
    setInterval(heartbeat, 5000);
    setInterval(function () { syncClock(2); }, 60000); // keep the clock fresh
  });
})();
</script>
</body>
</html>
