<!DOCTYPE html>
<!-- NGH-BUILD 10a · 2026-09-04a — blind-wager screen; media fail-safe; Stash banner removed -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>NGH Trivia Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --forest:#2d5a3d; --forest-dk:#1c3a26; --gold:#e7c15b; --gold-dk:#c9973a;
    --cream:#f6efdd; --maroon:#7a2e2e; --red:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--forest-dk);color:var(--cream);
    font-family:'Nunito',sans-serif;cursor:none}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:11vmin 4vmin 4vmin;box-sizing:border-box}
  .brand{font-family:'Alfa Slab One',serif;color:var(--gold);letter-spacing:.02em}
  .sub{font-family:'Caveat',cursive;color:var(--cream);opacity:.9}
  #roundTag{position:fixed;top:2.2vmin;left:2.6vmin;font-weight:800;font-size:3vmin;
    color:var(--gold);text-transform:uppercase;letter-spacing:.08em;display:none}
  #wagerTag{position:fixed;top:2.2vmin;right:2.6vmin;font-family:'Alfa Slab One',serif;
    font-size:3.2vmin;color:var(--red);background:var(--cream);padding:.6vmin 1.8vmin;
    border-radius:2vmin;display:none;transform:rotate(2deg)}
  #timer{position:fixed;bottom:2.4vmin;right:3vmin;font-family:'Alfa Slab One',serif;
    font-size:7vmin;color:var(--gold);display:none}
  #timer.hot{color:var(--red)}
  .prompt{font-size:6.2vmin;font-weight:800;line-height:1.25;max-width:88vw}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:2.4vmin;margin-top:4.5vmin;max-width:88vw}
  .choice{background:var(--forest);border:.45vmin solid var(--gold);border-radius:2vmin;
    padding:2.6vmin 3vmin;font-size:4.2vmin;font-weight:800;text-align:left}
  .choice b{color:var(--gold);margin-right:1.4vmin}
  .choice.win{background:var(--gold);color:var(--forest-dk)}
  .choice.win b{color:var(--maroon)}
  .devban-bottom{position:fixed;bottom:3vmin;left:50%;transform:translateX(-50%);z-index:2;margin:0}
  .intclock{font-family:'Alfa Slab One',serif;font-size:12vmin;color:var(--gold);line-height:1;margin:1vmin 0;
    text-shadow:0 .4vmin 1.2vmin rgba(0,0,0,.45)}
  .intgrid{display:flex;gap:4vmin;justify-content:center;align-items:flex-start;margin-top:2.5vmin;max-width:92vw}
  .intpanel{background:rgba(20,34,24,.55);border:.35vmin solid var(--gold-dk);border-radius:1.6vmin;padding:1.6vmin 2.2vmin;min-width:32vmin}
  .intpanel h4{font-family:'Alfa Slab One',serif;color:var(--gold);font-size:2.8vmin;margin:0 0 1vmin;font-weight:normal}
  .introw{display:flex;gap:1.4vmin;font-size:2.7vmin;font-weight:800;padding:.5vmin 0;text-align:left}
  .introw.done{opacity:.4;text-decoration:line-through}
  .introw.cur{color:var(--gold)}
  video,audio{max-width:88vw;max-height:62vh;border:.5vmin solid var(--gold);border-radius:1.6vmin;background:#000}
  img.clue{max-width:80vw;max-height:60vh;border:.5vmin solid var(--gold);border-radius:1.6vmin}
  #ytWrap{position:relative;width:72vw;height:40.5vw;max-height:56vh;max-width:99.5vh;margin:2vmin auto;
    border:.5vmin solid var(--gold);border-radius:1.6vmin;overflow:hidden;background:#000}
  #ytWrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #ytCover{position:absolute;inset:0;background:var(--forest-dk);display:none;
    align-items:center;justify-content:center;flex-direction:column;color:var(--gold);
    font-family:'Alfa Slab One',serif;font-size:9vmin;text-align:center}
  #ytWrap.audioonly #ytCover{display:flex}
  #ytBlock{position:absolute;left:0;right:0;bottom:0;height:16%;background:transparent}
  #overlay{position:fixed;inset:0;background:rgba(20,34,24,.96);display:none;
    flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center}
  #overlay .brand{font-size:7vmin}
  #overlay .msg{font-size:4vmin;margin-top:2.5vmin;font-weight:700}
  #fsBtn{position:fixed;inset:0;background:transparent;border:0;z-index:60;cursor:pointer;display:none}
  table.board{border-collapse:collapse;font-size:4.4vmin;min-width:60vw}
  table.board td,table.board th{padding:1.4vmin 3vmin;border-bottom:.3vmin solid rgba(231,193,91,.35);text-align:left}
  table.board td:last-child{text-align:right;font-family:'Alfa Slab One',serif;color:var(--gold)}
  table.board tr.gold td{color:var(--gold)}
  #qrBox{background:#fff;padding:2vmin;border-radius:2vmin;margin-top:4vmin}
  .small{font-size:2.6vmin;opacity:.75;margin-top:2vmin}
  .devban{background:var(--maroon);color:#fff;font-weight:800;font-size:2.8vmin;
    padding:1vmin 2.4vmin;border-radius:1.2vmin;letter-spacing:.02em;max-width:92vw}
  /* ---- tournament timer layout (NGH-BUILD 08a) ---- */
  body.wx{transition:background 2s}
  body.wx-clear-day{background:linear-gradient(#3f7fc4 0%,#7db2df 55%,#284a33 100%)}
  body.wx-clear-night{background:linear-gradient(#0a1026 0%,#141c3a 60%,#101b12 100%)}
  body.wx-cloudy-day{background:linear-gradient(#6a7f90 0%,#93a3ad 55%,#2a4433 100%)}
  body.wx-cloudy-night{background:linear-gradient(#141824 0%,#232a38 60%,#131d14 100%)}
  body.wx-rain-day{background:linear-gradient(#4a5b68 0%,#697c88 55%,#233b2c 100%)}
  body.wx-rain-night{background:linear-gradient(#0e1420 0%,#1b2430 60%,#111a12 100%)}
  body.wx-snow-day{background:linear-gradient(#8ea3b5 0%,#c3d2dd 55%,#39543f 100%)}
  body.wx-snow-night{background:linear-gradient(#131a2c 0%,#2a3446 60%,#16211a 100%)}
  body.wx-storm-day{background:linear-gradient(#39434e 0%,#525f6b 55%,#1e3326 100%)}
  body.wx-storm-night{background:linear-gradient(#0a0e16 0%,#161c26 60%,#0e150f 100%)}
  #wxLayer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  #sunGlow{position:absolute;top:6vmin;right:30vw;width:16vmin;height:16vmin;border-radius:50%;
    background:radial-gradient(circle,#ffe9a3 0%,#f5c542 45%,rgba(245,197,66,0) 72%);display:none;
    animation:sunpulse 6s ease-in-out infinite}
  @keyframes sunpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #moon{position:absolute;top:7vmin;right:31vw;width:9vmin;height:9vmin;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#f4f1e0,#c9c6b4);box-shadow:0 0 4vmin rgba(244,241,224,.5);display:none}
  .star{position:absolute;width:.4vmin;height:.4vmin;background:#fff;border-radius:50%;opacity:.8;
    animation:twinkle 3s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.95}}
  .cloud{position:absolute;background:rgba(255,255,255,.75);border-radius:50vmin;filter:blur(.6vmin);
    animation:drift linear infinite}
  .wx-night .cloud, body[class*="night"] .cloud{background:rgba(180,190,205,.35)}
  @keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
  .drop{position:absolute;top:-6vmin;width:.28vmin;height:3.4vmin;background:linear-gradient(rgba(180,210,255,0),rgba(180,210,255,.85));
    animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(115vh)}}
  .flake{position:absolute;top:-4vmin;color:#fff;font-size:2vmin;opacity:.9;animation:snowfall linear infinite}
  @keyframes snowfall{0%{transform:translateY(-5vh) translateX(0)}50%{transform:translateY(52vh) translateX(3vmin)}100%{transform:translateY(112vh) translateX(-2vmin)}}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2}
  #stage,#tHead,#roundTag,#wagerTag,#timer{z-index:1}
  body.wx #stage{justify-content:flex-start;padding:19vmin 27vw 4vmin;box-sizing:border-box}
  body.wx #stage .tlabel:first-child{margin-top:0}
  .tblGrid{margin-top:2.4vmin;background:rgba(20,34,24,.62);border:.35vmin solid var(--gold-dk);border-radius:1.6vmin;padding:1.4vmin 2vmin;max-width:64vmin}
  .tblGrid h4{font-family:'Alfa Slab One',serif;color:var(--gold);font-size:2.8vmin;margin:0 0 .8vmin;font-weight:normal}
  .tblGrid .pairRow{font-size:2.6vmin}
  .champBanner{font-family:'Alfa Slab One',serif;color:var(--gold);font-size:6vmin;margin-top:1.6vmin;text-shadow:0 .4vmin 1.2vmin rgba(0,0,0,.55)}
  #tHead{position:fixed;top:1.6vmin;left:0;right:0;display:none;align-items:flex-start;
    justify-content:space-between;padding:0 2.4vmin;z-index:1}
  #tHead img.crest{height:22vmin;filter:drop-shadow(0 .5vmin 1vmin rgba(0,0,0,.45))}
  #tHead .mid{text-align:center;padding-top:1vmin}
  #tHead .clock{font-family:'Alfa Slab One',serif;font-size:4.2vmin;line-height:1.05;color:var(--cream);text-shadow:0 .3vmin .8vmin rgba(0,0,0,.5)}
  #tHead .datewx{font-size:2.2vmin;font-weight:800;opacity:.92;margin-top:.5vmin;text-shadow:0 .2vmin .6vmin rgba(0,0,0,.5)}
  #tHead img.evimg{height:16vmin;max-width:24vw;object-fit:cover;border:.4vmin solid var(--gold);border-radius:1.4vmin}
  .bigclock{font-family:'Alfa Slab One',serif;font-size:21vmin;color:var(--gold);line-height:1;letter-spacing:.02em;
    text-shadow:0 .6vmin 1.6vmin rgba(0,0,0,.55)}
  .bigclock.hot{color:var(--red)}
  .bigclock.paused{opacity:.55}
  .tlabel{font-size:5.2vmin;font-weight:800;margin-top:1vmin;text-shadow:0 .3vmin .9vmin rgba(0,0,0,.5)}
  .tev{font-family:'Caveat',cursive;font-size:4vmin;opacity:.9;margin-top:1vmin;text-shadow:0 .2vmin .6vmin rgba(0,0,0,.5)}
  #schedPanel{position:fixed;right:2.4vmin;top:26vmin;width:26vw;max-height:60vh;overflow:hidden;z-index:1;
    background:rgba(20,34,24,.72);border:.35vmin solid var(--gold-dk);border-radius:1.6vmin;padding:1.6vmin 1.8vmin;display:none}
  #pairPanel{position:fixed;left:2.4vmin;top:26vmin;width:26vw;max-height:60vh;overflow:hidden;z-index:1;
    background:rgba(20,34,24,.72);border:.35vmin solid var(--gold-dk);border-radius:1.6vmin;padding:1.6vmin 1.8vmin;display:none}
  #pairPanel h4{font-family:'Alfa Slab One',serif;color:var(--gold);font-size:2.6vmin;margin:0 0 1vmin;font-weight:normal}
  .pairRow{display:flex;gap:1vmin;font-size:2.35vmin;font-weight:800;padding:.55vmin .9vmin;align-items:baseline}
  .pairRow .tno{font-family:'Alfa Slab One',serif;color:var(--gold);min-width:4.2vmin}
  .pairRow .done{opacity:.5;text-decoration:line-through}
  .standRow{display:flex;gap:1vmin;font-size:2.5vmin;font-weight:800;padding:.55vmin .9vmin}
  .standRow .pos{font-family:'Alfa Slab One',serif;color:var(--gold);min-width:4vmin}
  .standRow .pts{margin-left:auto;font-family:'Alfa Slab One',serif;color:var(--gold)}
  #schedPanel h4{font-family:'Alfa Slab One',serif;color:var(--gold);font-size:2.6vmin;margin:0 0 1vmin;font-weight:normal}
  .schedRow{display:flex;justify-content:space-between;gap:1vmin;font-size:2.5vmin;font-weight:800;
    padding:.7vmin .9vmin;border-radius:.9vmin;opacity:.65}
  .schedRow .dur{font-family:'Alfa Slab One',serif;color:var(--gold)}
  .schedRow.done{opacity:.35;text-decoration:line-through}
  .schedRow.cur{opacity:1;background:var(--gold);color:var(--ink)}
  .schedRow.cur .dur{color:var(--maroon)}
  .rosterWrap{display:flex;flex-wrap:wrap;gap:1vmin 3vmin;justify-content:center;max-width:86vw;margin-top:2.5vmin}
  .rosterName{font-size:3.1vmin;font-weight:800;text-shadow:0 .2vmin .6vmin rgba(0,0,0,.5)}
  .rosterName.ghost{opacity:.38;font-weight:400}
  .rosterName .tbl{color:var(--gold);font-size:2.2vmin;margin-left:.6vmin}
</style>
</head>
<body>
<div id="wxLayer"><div id="sunGlow"></div><div id="moon"></div></div>
<div id="flash"></div>
<div id="tHead">
  <img class="crest" src="stream-logo.png" alt="Northwood Game Haven">
  <div class="mid">
    <div class="clock" id="tClock">--:--</div>
    <div class="datewx" id="tDateWx"></div>
  </div>
  <img class="evimg" id="tEvImg" src="" alt="" style="display:none">
</div>
<div id="schedPanel"></div>
<div id="pairPanel"></div>
<div id="roundTag"></div>
<div id="wagerTag"></div>
<div id="stage"></div>
<div id="timer"></div>
<div id="overlay">
  <div class="brand">NORTHWOOD GAME HAVEN</div>
  <div class="msg" id="overlayMsg">Reconnecting…</div>
</div>
<button id="fsBtn" aria-label="fullscreen"></button>

<script>
/* =====================================================================
   NGH TRIVIA DISPLAY — NGH-BUILD 09e
   Dumb, resilient TV client.
   URL: trivia-display.html?game=GAME-XXXX&display=Retail
   - Server clock offset: median of ping samples against /api/trivia/time
   - Polls /api/trivia/games/:id/state?v=N every 1s (tiny "unchanged" reply)
   - PRELOAD phase: fetches media into Cache Storage, heartbeats ready ✓
   - LIVE phase: media playback scheduled at state.startAt (server epoch ms)
     with post-start drift correction against the shared clock
   - Heartbeat every 5s; obeys remote refresh command
   - Media plays MUTED by default (audio rides the host mixer chain);
     game setting tvAudio=true unmutes for TV-speaker fallback mode
   ===================================================================== */
(function () {
  "use strict";
  var API = "/api/trivia";
  var params = new URLSearchParams(location.search);
  var GAME = params.get("game") || "";
  var DISPLAY = params.get("display") || ("TV-" + Math.floor(Math.random() * 1000));

  var stage = document.getElementById("stage");
  var overlay = document.getElementById("overlay");
  var overlayMsg = document.getElementById("overlayMsg");
  var roundTag = document.getElementById("roundTag");
  var wagerTag = document.getElementById("wagerTag");
  var timerEl = document.getElementById("timer");
  var fsBtn = document.getElementById("fsBtn");

  if (!GAME) {
    stage.innerHTML = '<div class="brand" style="font-size:6vmin">Missing ?game= parameter</div>';
    return;
  }

  /* ------------------ clock sync ------------------ */
  var offsets = [];        // serverNow - localMidpoint samples
  var clockOffset = 0;     // median
  function median(a) {
    if (!a.length) return 0;
    var s = a.slice().sort(function (x, y) { return x - y; });
    return s[Math.floor(s.length / 2)];
  }
  function pingOnce() {
    var t0 = Date.now();
    return fetch(API + "/time").then(function (r) { return r.json(); }).then(function (j) {
      var t1 = Date.now();
      if (t1 - t0 > 800) return; // discard slow samples
      offsets.push(j.now - (t0 + t1) / 2);
      if (offsets.length > 15) offsets.shift();
      clockOffset = median(offsets);
    }).catch(function () {});
  }
  function serverNow() { return Date.now() + clockOffset; }
  function syncClock(n) {
    var p = Promise.resolve();
    for (var i = 0; i < n; i++) p = p.then(pingOnce);
    return p;
  }

  /* ------------------ media cache ------------------ */
  var CACHE = "ngh-trivia-v1";
  var blobUrls = {}; // url -> objectURL
  function preloadAsset(url) {
    if (!url) return Promise.resolve(null);
    if (blobUrls[url]) return Promise.resolve(blobUrls[url]);
    function toBlobUrl(resp) {
      return resp.blob().then(function (b) {
        blobUrls[url] = URL.createObjectURL(b);
        return blobUrls[url];
      });
    }
    if (window.caches) {
      return caches.open(CACHE).then(function (c) {
        return c.match(url).then(function (hit) {
          if (hit) return toBlobUrl(hit);
          return fetch(url).then(function (resp) {
            if (!resp.ok) throw new Error("fetch " + resp.status);
            return c.put(url, resp.clone()).then(function () { return toBlobUrl(resp); });
          });
        });
      }).catch(function () {
        return fetch(url).then(toBlobUrl);
      });
    }
    return fetch(url).then(toBlobUrl).catch(function () { return url; });
  }

  /* ------------------ state ------------------ */
  var v = 0;                 // last seen version
  var st = null;             // last state payload
  var readyQKey = "";        // asset-preloaded question key
  var lastCmdSeq = Number(localStorage.getItem("ngh_trivia_cmdseq_" + DISPLAY) || 0);
  var failCount = 0;
  var mediaEl = null;
  var driftTimer = null;
  var playTimeout = null;
  var countdownTimer = null;

  function setOverlay(show, msg) {
    overlay.style.display = show ? "flex" : "none";
    if (msg) overlayMsg.textContent = msg;
  }

  function poll() {
    fetch(API + "/games/" + encodeURIComponent(GAME) + "/state?v=" + v)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        failCount = 0;
        setOverlay(false);
        // opportunistic clock sample from every poll's serverNow is too noisy
        // (payload timing varies); dedicated pings handle the clock.
        if (j.unchanged) return;
        v = j.v; st = j;
        render();
      })
      .catch(function () {
        failCount++;
        if (failCount >= 3) setOverlay(true, "Reconnecting…");
      });
  }

  function heartbeat() {
    fetch(API + "/games/" + encodeURIComponent(GAME) + "/heartbeat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        displayId: DISPLAY, name: DISPLAY,
        ready: !!readyQKey && !!st && !!st.q && readyQKey === st.q.key,
        qKeyReady: readyQKey, lastCmdSeq: lastCmdSeq
      })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.cmd && j.cmd.seq > lastCmdSeq) {
        lastCmdSeq = j.cmd.seq;
        localStorage.setItem("ngh_trivia_cmdseq_" + DISPLAY, String(lastCmdSeq));
        if (j.cmd.action === "refresh") location.reload();
      }
    }).catch(function () {});
  }

  /* ------------------ rendering ------------------ */
  function clearTimers() {
    if (driftTimer) { clearInterval(driftTimer); driftTimer = null; }
    if (playTimeout) { clearTimeout(playTimeout); playTimeout = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    mediaEl = null;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function tags() {
    if (st.round && st.round.title && ["live", "answering", "locked", "reveal", "preload"].indexOf(st.phase) >= 0) {
      roundTag.textContent = "Round " + (st.roundIdx + 1) + " · " + st.round.title +
        " · Q" + (st.qIdx + 1) + "/" + st.round.qCount;
      roundTag.style.display = "block";
    } else roundTag.style.display = "none";
    if (st.round && st.round.isWager && st.phase !== "lobby" && st.phase !== "scoreboard") {
      wagerTag.textContent = "💰 " + st.wagerLabel;
      wagerTag.style.display = "block";
    } else wagerTag.style.display = "none";
  }

  function startCountdown() {
    timerEl.style.display = "none";
    if (!st.deadline) return;
    countdownTimer = setInterval(function () {
      var left = Math.ceil((Number(st.deadline) - serverNow()) / 1000);
      if (left <= 0) {
        timerEl.textContent = "0";
        timerEl.classList.add("hot");
        clearInterval(countdownTimer); countdownTimer = null;
        return;
      }
      timerEl.textContent = String(left);
      timerEl.classList.toggle("hot", left <= 10);
      timerEl.style.display = "block";
    }, 200);
  }

  function scheduleMedia(el, kind) {
    // Play precisely at st.startAt (server epoch ms) on the shared clock,
    // then correct drift so three rooms stay lip-sync tight.
    el.muted = !(st.settings && st.settings.tvAudio);
    var fire = function () {
      var lateBy = (serverNow() - Number(st.startAt)) / 1000;
      try { if (lateBy > 0.25) el.currentTime = lateBy; } catch (e) {}
      el.play().catch(function () {});
    };
    var delay = Number(st.startAt) - serverNow();
    if (delay > 30) playTimeout = setTimeout(fire, delay);
    else fire();
    if (kind !== "image") {
      driftTimer = setInterval(function () {
        if (!el.duration || el.paused) return;
        var expected = (serverNow() - Number(st.startAt)) / 1000;
        if (expected > el.duration) { clearInterval(driftTimer); driftTimer = null; return; }
        if (Math.abs(el.currentTime - expected) > 0.15) {
          try { el.currentTime = expected; } catch (e) {}
        }
      }, 3000);
    }
  }

  /* ---------- YouTube clue player (NGH-BUILD 09e) ---------- */
  var ytPlayer = null, ytReady = false, ytPending = null, ytStopTimer = null;
  function loadYT() {
    if (window.YT && window.YT.Player) { ytReady = true; return; }
    if (document.getElementById("ytapi")) return;
    var t = document.createElement("script");
    t.id = "ytapi"; t.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(t);
    window.onYouTubeIframeAPIReady = function () {
      ytReady = true;
      if (ytPending) { var p = ytPending; ytPending = null; ytMount(p.m, p.play); }
    };
  }
  loadYT();
  function ytMount(m, playNow) {
    if (!ytReady) { ytPending = { m: m, play: playNow }; return; }
    var host = document.getElementById("ytHost");
    if (!host) return;

    if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return "rain";

    if (c >= 95) return "storm";

      var nx = st.next;
      var h = '<div class="devban">📵 Use of phones or devices to search for answers is STRICTLY PROHIBITED during the game</div>' +
        '<div class="brand" style="font-size:6.5vmin;margin-top:1vmin">☕ INTERMISSION</div>' +
        '<div class="intclock" id="intClock">–:––</div>';
      if (nx) {
        h += '<div class="sub" style="font-size:4.6vmin">Up next: Round ' + (nx.roundIdx + 1) +
          " — " + esc(nx.title) + (nx.isWager ? " 💰 " + esc(st.wagerLabel) : "") + "</div>";
      }
      h += '<div class="intgrid">';
      // standings panel
      h += '<div class="intpanel"><h4>📊 STANDINGS</h4>';
      if (!rows0.length) h += '<div class="introw" style="opacity:.6">Scores post after the first reveal</div>';
      for (var m = 0; m < Math.min(rows0.length, 10); m++) {
        h += '<div class="introw' + (m === 0 ? " cur" : "") + '"><span style="min-width:4vmin">' + (m + 1) + '.</span><span style="flex:1">' +
          esc(rows0[m].team) + '</span><span>' + rows0[m].score + "</span></div>";
      }
      h += "</div>";
      // upcoming rounds panel
      var outline = st.roundsOutline || [];
      if (outline.length) {
        var nxIdx = nx ? (nx.roundIdx | 0) : -1;
        h += '<div class="intpanel"><h4>🗺 ROUNDS</h4>';
        outline.forEach(function (r0, i0) {
          var cls = nxIdx >= 0 ? (i0 < nxIdx ? "done" : (i0 === nxIdx ? "cur" : "")) : "";
          h += '<div class="introw ' + cls + '"><span style="min-width:4vmin">' + (i0 + 1) + '.</span><span style="flex:1">' +
            esc(r0.title || ("Round " + (i0 + 1))) + (r0.isWager ? " 💰" : "") + "</span></div>";
        });
        h += "</div>";
      }
      h += "</div>";
      stage.innerHTML = h;
      // centered M:SS break clock off the shared deadline
      if (st.deadline) {
        countdownTimer = setInterval(function () {
          var el = document.getElementById("intClock");
          if (!el) return;
          var left = Math.max(0, Number(st.deadline) - serverNow());
          var sM = Math.floor(left / 60000), sS = Math.floor((left % 60000) / 1000);
          el.textContent = sM + ":" + String(sS).padStart(2, "0");
        }, 250);
      }
      return;
    }

    if (ph === "scoreboard" || ph === "ended") {
      var rows = st.scoreboard || [];
      var t = '<div class="brand" style="font-size:7vmin;margin-bottom:3vmin">' +
        (ph === "ended" ? "FINAL SCORES" : "SCOREBOARD") + "</div><table class='board'>";
      for (var k = 0; k < Math.min(rows.length, 12); k++) {
        t += "<tr" + (k === 0 ? ' class="gold"' : "") + "><td>" + (k + 1) + ".</td><td>" +
          esc(rows[k].team) + "</td><td>" + rows[k].score + "</td></tr>";
      }
      t += "</table>";
      if (!rows.length) t += '<div class="sub" style="font-size:5vmin">No scores yet</div>';
      stage.innerHTML = t;
      return;
    }
  }

  function normalizeLite(s) {
    return String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  }

  /* ------------------ fullscreen kiosk ------------------ */
  function tryFullscreen() {
    var el = document.documentElement;
    var f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f) { try { f.call(el); } catch (e) {} }
    fsBtn.style.display = "none";
  }
  document.addEventListener("fullscreenchange", function () {
    fsBtn.style.display = document.fullscreenElement ? "none" : "block";
  });
  fsBtn.addEventListener("click", tryFullscreen);
  // Kiosk browsers (Fully Kiosk etc.) are already fullscreen; on a normal
  // browser one tap anywhere enters fullscreen.
  fsBtn.style.display = "block";

  /* ------------------ boot ------------------ */
  setOverlay(true, "Connecting…");
  syncClock(5).then(function () {
    setOverlay(false);
    poll();
    setInterval(poll, 1000);
    heartbeat();
    setInterval(heartbeat, 5000);
    setInterval(function () { syncClock(2); }, 60000); // keep the clock fresh
  });
})();
</script>
</body>
</html>
