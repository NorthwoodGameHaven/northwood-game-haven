<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCG Life Counter — Game Companion</title>
<meta name="theme-color" content="#132a1d">
<link rel="manifest" href="/app/manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;600&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/app.css">
<style>
/* ---- page shell ---- */
html,body{height:100%}
body.noscroll{overflow:hidden;overscroll-behavior:none}
.app.lc-app{max-width:none;padding:0;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.app.lc-app .app-header{margin:0}
.app.lc-app .app-header .title{font-size:.98rem}
.app.lc-app .app-header .actions{gap:4px}
.app.lc-app .app-header .icon-btn{width:38px;height:38px;font-size:17px;position:relative;-webkit-tap-highlight-color:transparent;padding:0;transition:background .15s}
.app.lc-app .app-header .icon-btn::after{content:"";position:absolute;inset:-5px;border-radius:50%}
.app.lc-app .app-header .icon-btn:disabled{opacity:.35}
.app.lc-app .app-header .icon-btn.on{background:rgba(232,184,75,.22);border-color:var(--gold)}
body.night{background-image:radial-gradient(1200px 600px at 50% -10%,rgba(31,58,95,.5),transparent 60%),radial-gradient(circle at 20% 110%,rgba(201,151,58,.08),transparent 40%)}

/* ---- table ---- */
.table{position:relative;padding:6px;gap:6px;min-height:calc(100vh - var(--hdr,58px));flex:1}
.table.around{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);
  height:calc(100vh - var(--hdr,58px));height:calc(100dvh - var(--hdr,58px));min-height:0;overflow:hidden;padding-bottom:calc(6px + var(--safe-b))}
.table.around.two{grid-template-columns:1fr}
.table.list{display:flex;flex-direction:column;padding-bottom:calc(88px + var(--safe-b))}
.table.list .pt{min-height:120px;flex:1}

/* ---- player tile ---- */
.pt{position:relative;border-radius:16px;overflow:hidden;min-height:0;min-width:0;display:flex;flex-direction:column;
  background:var(--c);
  background:linear-gradient(165deg,color-mix(in srgb,var(--c) 82%,#fff) -10%,var(--c) 40%,color-mix(in srgb,var(--c) 72%,#000) 110%);
  color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 6px 18px rgba(0,0,0,.3);container-type:inline-size;transition:filter .3s,box-shadow .2s}
.pt.rot{transform:rotate(180deg)}
.pt.span{grid-column:1/-1}
.pt.monarch{box-shadow:inset 0 0 0 3px var(--gold-lt),0 0 18px rgba(232,184,75,.45)}
.pt.active{box-shadow:inset 0 0 0 3px rgba(255,255,255,.75),0 6px 18px rgba(0,0,0,.3)}
.pt.picked{animation:pickGlow .55s ease-in-out 6 alternate}
@keyframes pickGlow{from{box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}to{box-shadow:inset 0 0 0 6px var(--gold-lt),0 0 30px var(--gold-lt)}}
body.night .pt{filter:brightness(.82) saturate(.9)}
.pt.dead{filter:grayscale(.8) brightness(.45)}
body.night .pt.dead{filter:grayscale(.8) brightness(.38)}

.pt-name{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 10px 0;min-height:36px;font:700 .9rem var(--font-body);text-shadow:0 1px 2px rgba(0,0,0,.55)}
.pt-name .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.pt-name .tm{display:none;position:relative;font-variant-numeric:tabular-nums;font:800 .78rem var(--font-body);background:rgba(0,0,0,.32);color:#fff;border:1px solid rgba(255,255,255,.25);padding:0 10px;border-radius:999px;height:30px;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pt-name .tm::after{content:"";position:absolute;inset:-7px}
.pt.timer .pt-name .tm{display:inline-flex}
.pt.active .pt-name .tm{background:var(--gold-lt);color:var(--ink);border-color:var(--gold-lt)}
.pt.active .pt-name .tm::before{content:"▶";font-size:.6rem;margin-right:5px}

.pt-area{flex:1;position:relative;display:grid;place-items:center;touch-action:none;cursor:pointer;min-height:64px}
.pt-area .zone{position:absolute;left:0;right:0;height:50%;display:flex;justify-content:center;font:300 28px var(--font-body);color:rgba(255,255,255,.3);pointer-events:none;line-height:1}
.pt-area .zone.up{top:0;align-items:flex-start;padding-top:2px}
.pt-area .zone.dn{bottom:0;align-items:flex-end;padding-bottom:2px}
.pt-life{font:700 64px var(--font-head);font-size:clamp(44px,40cqw,150px);line-height:1;text-shadow:0 3px 10px rgba(0,0,0,.45);letter-spacing:-.02em;font-variant-numeric:tabular-nums;position:relative;z-index:1;pointer-events:none}
.table.list .pt-life{font-size:clamp(44px,14cqw,64px)}
.pt-delta{position:absolute;top:10px;right:12px;background:rgba(0,0,0,.55);color:#fff;font:800 1rem var(--font-body);padding:4px 12px;border-radius:999px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:2;font-variant-numeric:tabular-nums}
.pt-delta.show{opacity:1;transition:none}

.pt-icons{display:flex;flex-wrap:wrap;justify-content:center;padding:0 0 2px}
.ib{width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:17px;line-height:1;display:grid;place-items:center;position:relative;cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent;opacity:.72;padding:0;font-family:var(--font-body)}
.ib:active{background:rgba(0,0,0,.28)}
.ib.on{opacity:1;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.ib .n{position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--gold-lt);color:var(--ink);font:800 .66rem var(--font-body);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.ib .n.hot{background:var(--red);color:#fff}
@media (max-width:374px){.ib{width:40px}}

.pt-stamp{position:absolute;inset:0;display:none;place-items:center;z-index:4;pointer-events:none}
.pt.dead .pt-stamp{display:grid}
.pt-stamp span{font:700 1.3rem var(--font-head);letter-spacing:.18em;color:#ff5a5a;border:3px solid #ff5a5a;padding:6px 14px;border-radius:8px;transform:rotate(-14deg);background:rgba(0,0,0,.4);text-shadow:0 0 12px rgba(255,60,60,.5);white-space:nowrap}
.pt-stamp small{display:block;font:700 .62rem var(--font-body);letter-spacing:.1em;color:#ffd0d0;text-align:center;margin-top:2px}
.table.list .pt-stamp span{font-size:1rem;transform:rotate(-6deg)}

/* in-tile overlay (commander damage / counters) */
.pt-ov{position:absolute;inset:0;background:rgba(10,20,14,.95);color:var(--cream);display:flex;flex-direction:column;z-index:5;border-radius:16px}
.pt-ov .ov-h{display:flex;align-items:center;gap:8px;padding:6px 6px 2px 12px;font:600 .82rem var(--font-head);letter-spacing:.03em;flex:none}
.pt-ov .ov-h .x{margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--cream);font-size:18px;cursor:pointer;flex:none;position:relative}
.pt-ov .ov-h .x::after{content:"";position:absolute;inset:-4px}
.pt-ov .ov-b{flex:1;overflow:auto;padding:0 8px 8px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.ov-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.ov-row:last-child{border-bottom:0}
.ov-row .who{display:flex;align-items:center;gap:7px;font-weight:700;font-size:.84rem;min-width:0;flex:1 1 90px}
.ov-row .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.stp{display:inline-flex;align-items:center;gap:3px}
.stp button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--cream);font:700 20px var(--font-body);cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
.stp button:active{background:rgba(232,184,75,.25)}
.stp .v{min-width:34px;text-align:center;font:600 1.15rem var(--font-head);font-variant-numeric:tabular-nums}
.stp .v.hot{color:#ff6b6b}
.stp .lbl{font-size:.68rem;color:var(--muted);width:12px;text-align:center}
.ov-empty{color:var(--muted);font-size:.85rem;padding:10px 4px}

/* centre button */
.cbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;border:2px solid var(--gold);
  background:radial-gradient(circle at 35% 30%,#2f5f40,#132a1d 70%);color:var(--gold-lt);font-size:22px;display:grid;place-items:center;z-index:8;
  box-shadow:0 6px 18px rgba(0,0,0,.55);cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
.cbtn:active{transform:translate(-50%,-50%) scale(.94)}
.table.list .cbtn{position:fixed;left:auto;right:18px;top:auto;bottom:calc(18px + var(--safe-b));transform:none}
.table.list .cbtn:active{transform:scale(.94)}

/* ---- sheets ---- */
.sheet>div{max-height:90vh;max-height:90dvh}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sh-h h2{margin:0;flex:1}
.sh-h .icon-btn{flex:none}
.chips.wrap .chip{min-height:44px;display:inline-flex;align-items:center;flex:1;justify-content:center}
.pe{display:flex;gap:8px;align-items:center;margin:8px 0}
.pe .swb{width:46px;height:46px;border-radius:12px;border:2px solid rgba(255,255,255,.35);flex:none;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);-webkit-tap-highlight-color:transparent}
.pe input.f{flex:1;min-width:0}
.pe .ptn{flex:none;min-height:44px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);font:800 .72rem var(--font-body);cursor:pointer;-webkit-tap-highlight-color:transparent;line-height:1.1;text-align:center}
.pe .ptn.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{min-height:64px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--cream);font:800 .92rem var(--font-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.menu button .ic{font-size:24px;line-height:1}
.menu button.gold{background:linear-gradient(180deg,rgba(232,184,75,.28),rgba(232,184,75,.08));border-color:var(--gold)}
.die-out{text-align:center;min-height:120px;display:grid;place-items:center;margin:6px 0 10px}
.die-out .big{font:700 4.2rem var(--font-head);color:var(--gold-lt);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.die-out .lbl{color:var(--muted);font-size:.85rem;margin-top:6px}
.hist{list-style:none;margin:0;padding:0;max-height:52vh;overflow:auto}
.hist li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:.9rem;align-items:baseline}
.hist li .t{color:var(--muted);font-size:.74rem;flex:none;font-variant-numeric:tabular-nums;width:48px}
.hist li:first-child{color:var(--gold-lt)}
.hist .none{color:var(--muted);padding:14px 0;text-align:center}
</style>
</head>
<body class="noscroll">
<div class="app lc-app">
  <header class="app-header" id="hdr">
    <a class="back" href="/app/companion/" aria-label="Back">‹</a>
    <div class="title">Life Counter</div>
    <div class="actions">
      <button class="icon-btn" id="btnDay" type="button" aria-label="Toggle day / night" title="Day / Night">☀</button>
      <button class="icon-btn" id="btnUndo" type="button" aria-label="Undo" title="Undo">↶</button>
      <button class="icon-btn" id="btnSettings" type="button" aria-label="Settings" title="Settings">⚙</button>
      <button class="icon-btn" id="btnNew" type="button" aria-label="New game" title="New game">⟲</button>
    </div>
  </header>

  <main class="table around" id="table">
    <button class="cbtn" id="btnMenu" type="button" aria-label="Table menu: dice, history, timer">🎲</button>
  </main>
</div>

<!-- Table menu -->
<div class="sheet" id="shMenu" hidden>
  <div>
    <div class="sh-h"><h2>🎲 Table</h2><button class="icon-btn" type="button" data-close aria-label="Close">✕</button></div>
    <div class="menu">
      <button type="button" class="gold" id="mDice"><span class="ic">🎲</span>Dice &amp; coin</button>
      <button type="button" id="mHist"><span class="ic">📜</span>History</button>
      <button type="button" id="mFirst"><span class="ic">👆</span>Random player</button>
      <button type="button" id="mNext"><span class="ic">⏭</span>Next turn</button>
      <button type="button" id="mTimer"><span class="ic">⏱</span><span id="mTimerL">Turn timer: off</span></button>
      <button type="button" id="mNight"><span class="ic" id="mNightI">☀</span><span id="mNightL">Day</span></button>
    </div>
  </div>
</div>

<!-- Dice & coin -->
<div class="sheet" id="shDice" hidden>
  <div>
    <div class="sh-h"><h2>🎲 Dice &amp; coin</h2><button class="icon-btn" type="button" data-close aria-label="Close">✕</button></div>
    <div class="die-out"><div><div class="big" id="dieBig">—</div><div class="lbl" id="dieLbl">Roll something</div></div></div>
    <div class="btn-row">
      <button class="btn ghost" type="button" data-die="6">d6</button>
      <button class="btn ghost" type="button" data-die="20">d20</button>
      <button class="btn ghost" type="button" data-die="coin">Coin</button>
    </div>
    <div class="btn-row">
      <button class="btn ghost" type="button" data-die="4">d4</button>
      <button class="btn ghost" type="button" data-die="8">d8</button>
      <button class="btn ghost" type="button" data-die="10">d10</button>
      <button class="btn ghost" type="button" data-die="12">d12</button>
    </div>
    <button class="btn block" type="button" id="dieFirst">👆 Pick a random player</button>
  </div>
</div>

<!-- History -->
<div class="sheet" id="shHist" hidden>
  <div>
    <div class="sh-h"><h2>📜 History</h2><button class="icon-btn" type="button" data-close aria-label="Close">✕</button></div>
    <ul class="hist" id="histList"></ul>
    <div class="btn-row"><button class="btn ghost" type="button" id="histUndo">↶ Undo last</button><button class="btn" type="button" data-close>Done</button></div>
  </div>
</div>

<!-- Resume prompt -->
<div class="sheet" id="shResume" hidden>
  <div>
    <h2>Resume last game?</h2>
    <p class="muted small" id="resumeInfo"></p>
    <div class="btn-row"><button class="btn ghost" type="button" id="resumeNo">New game</button><button class="btn" type="button" id="resumeYes">Resume</button></div>
  </div>
</div>

<!-- Setup / settings -->
<div class="sheet" id="shSetup" hidden>
  <div>
    <div class="sh-h"><h2 id="setupTitle">New game</h2><button class="icon-btn" type="button" id="setupCancel" aria-label="Close">✕</button></div>
    <div id="setupNewOnly">
      <label class="f">Players</label>
      <div class="chips wrap" id="chipsN"></div>
      <label class="f">Starting life</label>
      <div class="chips wrap" id="chipsLife"><span class="chip" data-v="20">20</span><span class="chip" data-v="30">30</span><span class="chip sel" data-v="40">40 · Commander</span></div>
    </div>
    <label class="f">Layout</label>
    <div class="chips wrap" id="chipsLayout"><span class="chip sel" data-v="around">Around the table</span><span class="chip" data-v="list">Everyone upright</span></div>
    <label class="f">Players — name · color · partner commanders</label>
    <div id="peList"></div>
    <div class="switch"><span>Turn timer on tiles</span><input type="checkbox" id="setTimer"></div>
    <div class="btn-row" style="margin-top:12px"><button class="btn big" type="button" id="setupGo">Start game</button></div>
  </div>
</div>

<script src="/app/ngh-app.js"></script>
<script>
(function () {
  'use strict';
  var N = window.NGH, $ = N.$, esc = N.esc;
  var COLORS = [
    { n: 'Red', c: '#d7263d' }, { n: 'Orange', c: '#e8641b' }, { n: 'Gold', c: '#c9973a' }, { n: 'Green', c: '#2e9e5b' },
    { n: 'Teal', c: '#1793a6' }, { n: 'Blue', c: '#2f6ddb' }, { n: 'Violet', c: '#7c3aed' }, { n: 'Pink', c: '#d94f9a' },
    { n: 'Bronze', c: '#8a5a2b' }, { n: 'Slate', c: '#55677a' }
  ];
  var CTR = { poison: { ic: '🧪', l: 'Poison', max: 10 }, energy: { ic: '⚡', l: 'Energy' }, exp: { ic: '✨', l: 'Experience' } };
  var HIST_MAX = 200, MERGE_MS = 1200;
  var save = N.store('ngh_life_game');
  var S = null;          // game state (persisted)
  var tiles = [];        // built tile DOM refs, one per player
  var pend = null;       // pending mergeable history entry {key, entry, t}
  var timerLoop = null;

  // ---------- state ----------
  function mkPlayer(i, life) {
    return { name: 'Player ' + (i + 1), color: COLORS[i % COLORS.length].c, life: life, poison: 0, energy: 0, exp: 0,
      city: false, partner: false, cmd: {}, ms: 0, ov: null };
  }
  function newState(o) {
    var st = { v: 1, started: Date.now(), layout: o.layout || 'around', startLife: o.life, players: [], monarch: -1, initiative: -1,
      night: false, timerOn: !!o.timer, active: -1, turnAt: 0, history: [] };
    for (var i = 0; i < o.players; i++) {
      var p = mkPlayer(i, o.life);
      if (o.names && o.names[i]) p.name = o.names[i];
      if (o.colors && o.colors[i]) p.color = o.colors[i];
      if (o.partners) p.partner = !!o.partners[i];
      st.players.push(p);
    }
    st.players.forEach(function (p, i) { st.players.forEach(function (_, j) { if (i !== j) p.cmd[j] = [0, 0]; }); });
    return st;
  }
  function isFresh(st) { return !st.history || !st.history.length; }
  function maxCmd(p) { var m = 0; for (var k in p.cmd) { m = Math.max(m, p.cmd[k][0], p.cmd[k][1]); } return m; }
  function autoDead(p) { return p.life <= 0 || p.poison >= 10 || maxCmd(p) >= 21; }
  function isDead(p) { return p.ov === false ? false : autoDead(p); }
  function alivePlayers() { var a = []; S.players.forEach(function (p, i) { if (!isDead(p)) a.push(i); }); return a; }

  function getPath(o, path) { var ps = path.split('.'); for (var i = 0; i < ps.length; i++) { if (o == null) return undefined; o = o[ps[i]]; } return o; }
  function setPath(o, path, v) { var ps = path.split('.'); for (var i = 0; i < ps.length - 1; i++) { if (o[ps[i]] == null) o[ps[i]] = {}; o = o[ps[i]]; } o[ps[ps.length - 1]] = v; }

  // ---------- history / undo ----------
  function trimHist() { if (S.history.length > HIST_MAX) S.history.splice(0, S.history.length - HIST_MAX); }
  function finalizePending() { if (pend) { clearTimeout(pend.t); pend = null; } }
  // Non-mergeable entry
  function record(label, changes) {
    finalizePending();
    S.history.push({ t: Date.now(), l: label, ch: changes });
    trimHist();
  }
  // Mergeable entry: rapid changes with the same key coalesce into one undo step ("40 → 37")
  function recordMerge(key, changes, labelFn) {
    var top = S.history[S.history.length - 1];
    if (pend && pend.key === key && top === pend.entry) {
      changes.forEach(function (c, n) { if (pend.entry.ch[n]) pend.entry.ch[n][2] = c[2]; else pend.entry.ch.push(c); });
      pend.entry.l = labelFn(pend.entry.ch);
    } else {
      finalizePending();
      var e = { t: Date.now(), l: '', ch: changes };
      e.l = labelFn(e.ch);
      S.history.push(e); trimHist();
      pend = { key: key, entry: e };
    }
    clearTimeout(pend.t); pend.t = setTimeout(finalizePending, MERGE_MS);
    return pend.entry;
  }
  function undo() {
    finalizePending();
    var e = S.history.pop();
    if (!e) { N.toast('Nothing to undo'); return; }
    for (var i = e.ch.length - 1; i >= 0; i--) setPath(S, e.ch[i][0], e.ch[i][1]);
    N.haptic('light'); N.toast('Undo · ' + e.l);
    render();
  }

  // ---------- mutations ----------
  function sgn(n) { return (n > 0 ? '+' : '') + n; }
  function clearOv(p, ch, i) { if (p.ov === false) { ch.push(['players.' + i + '.ov', false, null]); p.ov = null; } }
  function defeatCheck(p, wasDead) {
    var d = isDead(p);
    if (d && !wasDead) { N.haptic('warn'); N.toast(p.name + ' is defeated'); closeOverlay(tileOf(p)); }
    else N.haptic('light');
  }
  function changeLife(i, d) {
    var p = S.players[i], wasDead = isDead(p), b = p.life;
    p.life = b + d;
    var ch = [['players.' + i + '.life', b, p.life]];
    clearOv(p, ch, i);
    var e = recordMerge('life:' + i, ch, function (c) { return p.name + ': ' + c[0][1] + ' → ' + c[0][2]; });
    showDelta(i, e.ch[0][2] - e.ch[0][1]);
    defeatCheck(p, wasDead);
    render();
  }
  function changeCmd(i, j, k, d) {

    for (i = 0; i < setup.n; i++) names[i] = setup.names[i] || ('Player ' + (i + 1));
    if (setup.mode === 'new' || !S) {
      S = newState({ players: setup.n, life: setup.life, layout: setup.layout, timer: setup.timer, names: names, colors: setup.colors, partners: setup.partners });
      finalizePending(); closeSheets(); start(); N.toast('New game · ' + setup.n + ' players · ' + setup.life + ' life');
      return;
    }
    var relayout = S.layout !== setup.layout;
    S.players.forEach(function (p, n) { p.name = names[n]; p.color = setup.colors[n]; p.partner = !!setup.partners[n]; });
    S.layout = setup.layout; S.timerOn = setup.timer; if (!S.timerOn) stopActive();
    closeSheets();
    if (relayout) buildTable();
    render(); N.toast('Settings saved');
  });

  // ---------- resume prompt ----------
  function showResume(saved) {
    var mins = Math.max(1, Math.round((Date.now() - (saved.started || Date.now())) / 60000));
    var lives = saved.players.map(function (p) { return esc(p.name) + ' ' + p.life; }).join(' · ');
    $('resumeInfo').innerHTML = saved.players.length + ' players · started ' + (mins < 60 ? mins + ' min ago' : Math.round(mins / 60) + ' h ago') + '<br>' + lives;
    $('resumeYes').onclick = function () { S = saved; closeSheets(); start(); };
    $('resumeNo').onclick = function () { closeSheets(); openSetup('new', saved); };
    openSheet('shResume');
  }

  // ---------- boot ----------
  function measureHeader() { document.documentElement.style.setProperty('--hdr', $('hdr').offsetHeight + 'px'); }
  function start() {
    buildTable(); render();
    if (!timerLoop) timerLoop = setInterval(tickTimers, 500);
    N.wakeLock();
  }
  measureHeader();
  if (window.ResizeObserver) new ResizeObserver(measureHeader).observe($('hdr')); else window.addEventListener('resize', measureHeader);
  document.addEventListener('pointerdown', function once() { N.wakeLock(); document.removeEventListener('pointerdown', once); });
  document.addEventListener('visibilitychange', function () { if (S) { if (document.hidden) save.set(S); else tickTimers(); } });

  var saved = save.get(null);
  if (saved && saved.v === 1 && saved.players && saved.players.length) {
    saved.history = saved.history || [];
    if (isFresh(saved)) { S = saved; start(); } else showResume(saved);
  } else {
    openSetup('new');
  }
})();
</script>
