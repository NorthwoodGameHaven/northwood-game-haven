<!DOCTYPE html>
<!-- NGH · Auto TV — NGH-BUILD 2026-09-12m
     THE ONE URL A SCREEN EVER NEEDS: gamehaven.guru/tv-auto

     Point the Google TV Streamer 4K (or any TV, or a browser in kiosk mode) at
     this once and never touch it again. It follows the venue mode and swaps
     itself to the right board — Magic, Trivia, Karaoke, Speed Gaming, or the
     idle house screen.

     Why a frame rather than a redirect: a redirect loses this page, and with it
     the thing that knows how to come back. A streamer that navigated away would
     need somebody to physically re-point it. This page stays put and only ever
     changes what is inside it, so the recovery path never depends on a human
     being in the building.

     ?force=karaoke pins one screen to a mode and ignores the venue — for the
     night you want the karaoke lyrics on one TV while the rest follow along. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwood Game Haven</title>
<style>
  html,body{height:100%;margin:0;background:#132a1d;overflow:hidden}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#132a1d}
  /* Shown only while we have never successfully loaded anything, so a screen
     that is merely between modes does not flash a splash at the room. */
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;color:#f6efdd;font-family:'Cinzel',Georgia,serif;text-align:center;background:#132a1d;
    background-image:radial-gradient(1400px 700px at 50% -10%,rgba(61,122,84,.4),transparent 62%)}
  #boot img{width:170px;opacity:.95}
  #boot .t{font-size:2rem;color:#e8b84b;letter-spacing:.04em}
  #boot .s{font-size:1.05rem;color:rgba(246,239,221,.6);letter-spacing:.2em;text-transform:uppercase}
  #err{position:fixed;bottom:14px;left:16px;color:rgba(246,239,221,.5);font:12px system-ui;display:none}
  body.warn #err{display:block}
</style>
</head>
<body>
<div id="boot">
  <img src="/brand/crest.png" alt="">
  <div class="t">Northwood Game Haven</div>
  <div class="s" id="bootMsg">Connecting</div>
</div>
<iframe id="frame" allow="autoplay; fullscreen; screen-wake-lock" referrerpolicy="same-origin"></iframe>
<div id="err"></div>
<script>
(function () {
  'use strict';
  var API = '/api/venue';
  var qs = new URLSearchParams(location.search);
  var FORCE = (qs.get('force') || '').toLowerCase();
  var frame = document.getElementById('frame');
  var boot = document.getElementById('boot');
  var bootMsg = document.getElementById('bootMsg');
  var errEl = document.getElementById('err');

  var version = 0, misses = 0, timer = null, current = null, booted = false;

  function show(url, label) {
    if (url === current) return;
    current = url;
    // Replace the element rather than re-point it. A long-lived streamer that
    // navigates one iframe for eight hours accumulates history and, on some
    // TV browsers, leaks the old document; a fresh element sidesteps both.
    var next = frame.cloneNode(false);
    next.setAttribute('src', url);
    frame.parentNode.replaceChild(next, frame);
    frame = next;
    if (!booted) { booted = true; boot.style.display = 'none'; }
    note('mode: ' + (label || url));
  }
  function note(t) { errEl.textContent = t; }

  function apply(s) {
    var mode = FORCE || (s && s.mode) || 'idle';
    var screen = FORCE
      ? ({ trivia: '/trivia-display.html', karaoke: '/app/karaoke/tv.html', mtg: '/mtg-tv',
           speedgaming: '/speedgaming-tv', idle: '/tv-idle' }[FORCE] || '/tv-idle')
      : (s && s.screen) || '/tv-idle';
    show(screen, (s && s.label) || mode);
  }

  function loop() {
    fetch(API + '/state?v=' + version).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (j) {
      misses = 0; document.body.classList.remove('warn');
      if (!j.unchanged) { version = j.version; apply(j); }
      schedule(5000);
    }).catch(function (e) {
      misses++;
      // A screen that has already got a board keeps showing it — losing the
      // network should never blank the room. Only a cold start that has never
      // reached the server falls back to the house screen.
      if (misses === 3 && !booted) { bootMsg.textContent = 'Starting up'; apply(null); }
      if (misses > 3) { document.body.classList.add('warn'); note('reconnecting… (' + misses + ')'); }
      schedule(Math.min(30000, 3000 * misses));
    });
  }
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(loop, ms); }

  // TV browsers suspend background tabs and come back with a stale clock;
  // re-check the moment we are visible again.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { clearTimeout(timer); loop(); } });
  // Belt and braces for a streamer left on for days: a full reload once an hour
  // clears anything the embedded browser has quietly leaked.
  setInterval(function () { if (document.hidden) location.reload(); }, 3600000);

  if (FORCE) { apply(null); note('pinned to ' + FORCE); }
  loop();
})();
</script>
</body>
</html>
