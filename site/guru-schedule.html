<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Guru Schedule Console — Northwood Game Haven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --forest:#2e5d3b; --forest-light:#3f7a50; --gold:#b8862d; --gold-light:#d4a94e;
    --den:#2b2b1f; --cream:#faf6ec; --dark:#1d2a1f; --maroon:#6e1f2b; --teal-dark:#134b57;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--cream); color:var(--den); }
  h1,h2,h3 { font-family:'Cinzel',serif; color:var(--forest); }
  a { color:var(--forest); }
  .wrap { max-width:1180px; margin:0 auto; padding:16px; }
  header.topbar { background:linear-gradient(135deg,var(--forest),#234a2e); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header.topbar h1 { color:#fff; margin:0; font-size:1.15rem; letter-spacing:0.05em; }
  header.topbar .caveat { font-family:'Caveat',cursive; color:var(--gold-light); font-size:1.15rem; }
  header.topbar .sp { flex:1; }
  .card { background:#fff; border:1px solid #e2e0d2; border-radius:14px; padding:16px 18px; margin-bottom:14px; box-shadow:0 4px 14px rgba(30,40,25,0.06); }
  .hint { font-size:0.8rem; color:#7a7a5a; }
  .btn { background:linear-gradient(135deg,var(--forest),var(--forest-light)); color:#fff; border:none; border-radius:50px; padding:11px 24px; font-family:'Cinzel',serif; font-size:0.82rem; letter-spacing:0.06em; cursor:pointer; transition:transform 0.15s,opacity 0.15s; }
  .btn:hover { transform:translateY(-1px); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  .btn-ghost { background:transparent; border:1.5px solid var(--forest); color:var(--forest); }
  .btn-gold { background:linear-gradient(135deg,var(--gold),var(--gold-light)); color:var(--dark); }
  .btn-danger { background:linear-gradient(135deg,#9a2b2b,#b23b3b); color:#fff; }
  .btn-sm { padding:8px 16px; font-size:0.74rem; }
  .btn-xs { padding:5px 11px; font-size:0.68rem; }
  input[type=text],input[type=date],input[type=time],input[type=number],select,textarea {
    font-family:inherit; font-size:0.9rem; padding:9px 11px; border:1.5px solid #d8d4c2; border-radius:9px; background:#fff; color:var(--den); max-width:100%;
  }
  input:focus,select:focus,textarea:focus { outline:none; border-color:var(--forest); }
  label { font-size:0.8rem; color:#5a5a44; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .tabbar { display:flex; gap:8px; margin:14px 0; flex-wrap:wrap; }
  .tab { padding:9px 16px; border-radius:50px; border:1.5px solid #d8e0d4; background:#fff; font-family:'Cinzel',serif; font-size:0.74rem; cursor:pointer; color:var(--forest); }
  .tab.active { background:var(--forest); color:#fff; border-color:var(--forest); }
  .chip { display:inline-block; padding:3px 10px; border-radius:50px; font-size:0.72rem; margin:2px 3px 2px 0; border:1px solid transparent; }
  .chip.guru { color:#fff; }
  .chip.none { background:#eee; color:#666; border-color:#ddd; }
  .chip.unassigned { background:#fff4dc; color:#9a6310; border-color:#e8cf9a; }
  .chip.store { background:#efe6f7; color:#5a2b7a; border-color:#d6c2ea; }
  .chip.unav { background:#f0f0f0; color:#555; border-color:#ccc; }
  .badge-red { background:#fdeaea; color:#8a2b2b; border:1px solid #e3b3b3; border-radius:8px; padding:2px 8px; font-size:0.72rem; }
  .badge-yel { background:#fff6dc; color:#8a6a10; border:1px solid #e8d59a; border-radius:8px; padding:2px 8px; font-size:0.72rem; }
  .badge-flag{ background:#efe6f7; color:#5a2b7a; border:1px solid #d6c2ea; border-radius:8px; padding:2px 8px; font-size:0.72rem; }
  .badge-ok  { background:#eef7f0; color:var(--forest); border:1px solid #c2e0cb; border-radius:8px; padding:2px 8px; font-size:0.72rem; }

  /* login */
  .gate { max-width:420px; margin:60px auto; text-align:center; }
  .err { color:#b23; font-size:0.82rem; margin-top:8px; display:none; }
  .err.show { display:block; }

  /* ===== schedule grid ===== */
  .sched-controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .sched-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .sched-grid { display:flex; min-width:640px; }
  .sched-timecol { width:52px; flex:none; padding-top:64px; }
  .sched-timecol .hrlab { height:44px; font-size:0.66rem; color:#8a8a6a; text-align:right; padding-right:6px; position:relative; top:-7px; }
  .sched-day { flex:1; min-width:120px; border-left:1px solid #e6e2d0; }
  .sched-dayhead { height:64px; padding:6px 6px 2px; font-size:0.72rem; text-align:center; border-bottom:2px solid #d8d4c2; overflow:hidden; }
  .sched-dayhead b { display:block; font-family:'Cinzel',serif; color:var(--forest); font-size:0.78rem; }
  .sched-dayhead .storeline { font-size:0.62rem; color:#5a2b7a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sched-body { position:relative; background:repeating-linear-gradient(to bottom, #fbf9f0 0, #fbf9f0 43px, #ece8d8 43px, #ece8d8 44px); }
  .blk { position:absolute; border-radius:7px; font-size:0.66rem; line-height:1.25; padding:3px 5px; overflow:hidden; cursor:pointer; }
  .blk.ev { color:#fff; z-index:3; box-shadow:0 1px 4px rgba(0,0,0,0.25); }
  .blk.ev.unassigned { background:#a8a288 !important; color:#2b2b1f; font-style:italic; }
  .blk.ev.draft { background-image:repeating-linear-gradient(45deg, rgba(0,0,0,0.18) 0, rgba(0,0,0,0.18) 2px, transparent 2px, transparent 6px); font-style:italic; }
  .blk.ev b { display:block; font-size:0.66rem; }
  .blk.shift { z-index:1; border:1.5px dashed rgba(90,43,122,0.55); background:repeating-linear-gradient(135deg, rgba(122,80,160,0.14) 0, rgba(122,80,160,0.14) 6px, rgba(122,80,160,0.05) 6px, rgba(122,80,160,0.05) 12px); color:#5a2b7a; cursor:default; }
  .blk.unav { z-index:2; background:repeating-linear-gradient(45deg, rgba(60,60,60,0.16) 0, rgba(60,60,60,0.16) 4px, rgba(60,60,60,0.06) 4px, rgba(60,60,60,0.06) 8px); border:1.5px dotted #888; color:#444; cursor:default; }
  .blk.conf-red { outline:3px solid #c0392b; outline-offset:-1px; }
  .blk.conf-yel { outline:3px solid #e0b62a; outline-offset:-1px; }

  /* modal */
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(20,30,20,0.55); z-index:9000; overflow:auto; padding:20px; }
  .modal { max-width:560px; margin:24px auto; background:#fff; border-radius:14px; padding:20px 22px; box-shadow:0 18px 50px rgba(0,0,0,0.3); }
  .kv { font-size:0.86rem; margin:5px 0; }
  .kv b { color:var(--forest); }

  .ev-card { border-left:5px solid var(--forest); }
  .ev-card.hl { animation:hl 2.2s ease; }
  @keyframes hl { 0% { box-shadow:0 0 0 4px var(--gold); } 100% { box-shadow:0 4px 14px rgba(30,40,25,0.06); } }
  .gcheck { display:inline-flex; align-items:center; gap:5px; border:1.5px solid #d8d4c2; border-radius:50px; padding:6px 12px; margin:3px 4px 3px 0; font-size:0.8rem; cursor:pointer; background:#fff; }
  .gcheck input { accent-color:var(--forest); }
  .gcheck.on { border-color:var(--forest); background:#eef7f0; }

  .audit-card { border-left:6px solid #ccc; }
  .audit-card.red { border-left-color:#c0392b; background:#fdf3f2; }
  .audit-card.yellow { border-left-color:#e0b62a; background:#fffaf0; }
  .audit-card.flag { border-left-color:#7a50a0; background:#faf6ff; }

  table.plain { border-collapse:collapse; width:100%; font-size:0.82rem; }
  table.plain th, table.plain td { text-align:left; padding:7px 8px; border-bottom:1px solid #eee6d4; }
  table.plain th { font-family:'Cinzel',serif; font-size:0.7rem; color:var(--forest); }

  /* print */
  #print-area { display:none; }
  @media print {
    body * { visibility:hidden; }
    #print-area, #print-area * { visibility:visible; }
    #print-area { display:block; position:absolute; left:0; top:0; width:100%; padding:20px; background:#fff; }
    #print-area h1 { font-size:1.3rem; margin:0 0 2px; }
    #print-area .pr-day { page-break-inside:avoid; margin-bottom:14px; }
    #print-area .pr-day h3 { border-bottom:2px solid #2e5d3b; margin:0 0 6px; padding-bottom:2px; font-size:1rem; }
    #print-area table { border-collapse:collapse; width:100%; font-size:11px; }
    #print-area td, #print-area th { border:1px solid #bbb; padding:4px 6px; text-align:left; vertical-align:top; }
    #print-area .pr-guru { font-weight:bold; }
  }
</style>
</head>
<body>

<header class="topbar">
  <h1>🦦 Guru Schedule Console <span style="font-size:0.6rem;opacity:0.6;font-family:Georgia,serif;">v1.2</span></h1>
  <span class="caveat">Who's running the Haven — Stay curious.</span>
  <span class="sp"></span>
  <a href="booking.html?admin=1" style="color:#fff;font-size:0.78rem;">Guru Console (bookings/events) →</a>
</header>

<div class="wrap">

  <!-- LOGIN GATE -->
  <div id="gate" class="gate card">
    <h2 style="margin-top:0;">Guru Login</h2>
    <p class="hint">Enter the admin code (same one as the booking Guru Console).</p>
    <input type="text" id="admin-code" placeholder="Admin code" style="width:100%;text-align:center;" autocomplete="off">
    <div class="err" id="gate-err">That code didn't work. Try again.</div>
    <div style="margin-top:14px;"><button class="btn" onclick="doLogin()">Unlock Console</button></div>
  </div>

  <!-- APP -->
  <div id="app" style="display:none;">
    <div class="tabbar">
      <button class="tab" id="tab-sched" onclick="setView('sched')">📅 Schedule</button>
      <button class="tab" id="tab-assign" onclick="setView('assign')">🎯 Event Gurus</button>

      <button class="tab" id="tab-audit" onclick="setView('audit')">🧭 Deconflict</button>
      <button class="tab" id="tab-export" onclick="setView('export')">📤 Export / Print</button>
      <span style="flex:1;"></span>
      <button class="tab" onclick="reload()">↻ Refresh</button>
      <button class="tab" onclick="logout()">Log out</button>
    </div>
    <div id="view-sched" style="display:none;"></div>
    <div id="view-assign" style="display:none;"></div>
    <div id="view-shifts" style="display:none;"></div>
    <div id="view-unavail" style="display:none;"></div>
    <div id="view-audit" style="display:none;"></div>
    <div id="view-export" style="display:none;"></div>
  </div>
</div>

<!-- DETAILS MODAL -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-box"></div>
</div>

<!-- PRINT AREA -->
<div id="print-area"></div>

<script src="ngh-config.js"></script>
<script>
/* =================================================================
   NGH GURU SCHEDULE CONSOLE
   Reads events from /events (existing backend, untouched) and guru
   data (assignments / store shifts / unavailability) from the new
   /gurus function. Admin-only; token shared with booking.html
   (sessionStorage "ngh_admin_token").
   ================================================================= */
var API_BASE = window.NGH_API_BASE || "/.netlify/functions";
var $ = function(id){ return document.getElementById(id); };
var pad = function(n){ return (n<10?"0":"")+n; };
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function timeToMins(t){ if(!t) return 0; var p=String(t).split(":"); return (+p[0])*60+(+p[1]||0); }
function minsToTime(m){ return pad(Math.floor(m/60))+":"+pad(m%60); }
function fmtTime(m){ var h=Math.floor(m/60), mm=m%60, ap=h>=12?"pm":"am"; var hh=h%12; if(hh===0)hh=12; return hh+(mm?":"+pad(mm):"")+ap; }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function addDays(ds,n){ var d=new Date(ds+"T12:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function addMonths(ds,n){ var d=new Date(ds+"T12:00:00"); d.setMonth(d.getMonth()+n); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function dowName(ds){ return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(ds+"T12:00:00").getDay()]; }
function fmtDate(ds){ var d=new Date(ds+"T12:00:00"); return dowName(ds)+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]+" "+d.getDate(); }
function weekStart(ds){ var d=new Date(ds+"T12:00:00"); return addDays(ds, -d.getDay()); }
function monthStart(ds){ return ds.slice(0,8)+"01"; }
function rangesOverlap(aS,aE,bS,bE){ return aS<bE && bS<aE; }

/* ---- recurrence (mirrors booking.html) ---- */
function recurrenceDates(startDate,freq,count){
  var dates=[startDate];
  for(var i=1;i<count;i++){
    if(freq==="weekly") dates.push(addDays(dates[i-1],7));
    else if(freq==="biweekly") dates.push(addDays(dates[i-1],14));
    else if(freq==="monthly") dates.push(addMonths(startDate,i));
  }
  return dates;
}
function eventDates(e){
  if(!e) return [];
  var dates = e.recurrence ? recurrenceDates(e.date,e.recurrence.freq,e.recurrence.count) : [e.date];
  if(e.exceptions && e.exceptions.length){ dates=dates.filter(function(d){ return e.exceptions.indexOf(d)<0; }); }
  return dates;
}
function shiftDates(s){ return s.recurrence ? recurrenceDates(s.date,s.recurrence.freq,s.recurrence.count) : [s.date]; }
function isDraftEvent(e){ return e && e.status==="draft"; }
var ROOM_NAMES = { holt:"The Holt", den:"Stash's Den", depths:"The Depths", lodge:"Lakeview Lodge (VRBO)", rest:"Otter's Rest (VRBO)" };
function roomName(id){ return ROOM_NAMES[id]||id; }
function roomsLabel(e){
  if(e && e.offsiteLocation) return "Offsite: "+e.offsiteLocation;
  return (e && e.rooms && e.rooms.length) ? e.rooms.map(roomName).join(", ") : "all rooms";
}

/* ---- gurus & colors ---- */
var GURUS = ["Dustin","Mike","Chad","Jen","Sarah","Kyle","Zach"];
var GURU_COLORS = { "Dustin":"#2e5d3b", "Mike":"#134b57", "Chad":"#9a6310", "Jen":"#7a2b6e", "Sarah":"#b23b3b", "Kyle":"#3b5bb2", "Zach":"#b2622b" };
var EXTRA_COLORS = ["#4a6d8c","#8c5a2b","#2b8c6e","#8c2b5a","#5a8c2b","#6e4a8c"];
function guruColor(g){
  if(GURU_COLORS[g]) return GURU_COLORS[g];
  var h=0; for(var i=0;i<g.length;i++) h=(h*31+g.charCodeAt(i))>>>0;
  return EXTRA_COLORS[h%EXTRA_COLORS.length];
}
function guruChip(g){ return '<span class="chip guru" style="background:'+guruColor(g)+';">'+esc(g)+'</span>'; }
function allGuruNames(){
  var set={}; GURUS.forEach(function(g){ set[g]=1; });
  cache.assignments.forEach(function(a){ (a.gurus||[]).forEach(function(g){ set[g]=1; }); });
  cache.shifts.forEach(function(s){ set[s.guru]=1; });
  cache.unavail.forEach(function(u){ set[u.guru]=1; });
  return Object.keys(set);
}

/* ---- API ---- */
function token(){ return sessionStorage.getItem("ngh_admin_token")||""; }
async function api(path, opts){
  opts=opts||{}; opts.headers=opts.headers||{};
  opts.headers["Content-Type"]="application/json";
  if(token()) opts.headers["Authorization"]="Bearer "+token();
  var r=await fetch(API_BASE+path, opts);
  if(r.status===204) return null;
  var body=null; try{ body=await r.json(); }catch(e){}
  if(!r.ok){ var err=new Error((body&&body.error)||("HTTP "+r.status)); err.status=r.status; err.body=body; throw err; }
  return body;
}

/* ---- state ---- */
var cache = { events:[], assignments:[], shifts:[], unavail:[] };
var curView="sched";
var sched = { mode:"week", anchor:todayStr(), filter:null, showUnassigned:true }; // filter = null (all) or {name:true}
var auditDays = 30;

/* ---- login ---- */
async function doLogin(){
  try{
    var r=await api("/admin-login",{method:"POST",body:JSON.stringify({code:$("admin-code").value})});
    if(r && r.token){ sessionStorage.setItem("ngh_admin_token", r.token); $("gate-err").classList.remove("show"); await boot(); return; }
  }catch(e){}
  $("gate-err").classList.add("show");
}
function logout(){ sessionStorage.removeItem("ngh_admin_token"); location.reload(); }
async function boot(){
  $("gate").style.display="none"; $("app").style.display="block";
  await reload();
}
async function reload(){
  var ev=await api("/events");
  var gd=await api("/gurus");
  cache.events=ev||[];
  cache.assignments=(gd&&gd.assignments)||[];
  cache.shifts=(gd&&gd.shifts)||[];
  cache.unavail=(gd&&gd.unavail)||[];
  setView(curView);
}

/* ---- assignment resolution ---- */
function asgFor(eventId, date){
  var ov=null, base=null;
  cache.assignments.forEach(function(a){
    if(a.eventId!==eventId) return;
    if(a.date===date) ov=a;
    else if(a.date==null) base=a;
  });
  return ov||base;
}
function gurusFor(eventId, date){
  var a=asgFor(eventId, date);
  if(!a) return { state:"unassigned", gurus:[] };
  if(a.none) return { state:"none", gurus:[], rec:a };
  return { state:"assigned", gurus:a.gurus||[], rec:a };
}

/* ---- occurrence collection ---- */
function eventItemsInRange(from,to){
  var out=[];
  cache.events.forEach(function(e){
    eventDates(e).forEach(function(d){
      if(d<from||d>to) return;
      var g=gurusFor(e.id,d);
      out.push({ type:"event", date:d, allDay:!!e.allDay,
        start:e.allDay?0:timeToMins(e.start), end:e.allDay?1440:timeToMins(e.end||e.start),
        startLbl:e.allDay?"All day":fmtTime(timeToMins(e.start)),
        endLbl:e.allDay?"":fmtTime(timeToMins(e.end||e.start)),
        title:(e.private?"🔒 ":"")+(e.title||"NGH Event")+(isDraftEvent(e)?" (draft)":""),
        eventId:e.id, ev:e, gurus:g.gurus, gstate:g.state });
    });
  });
  return out;
}
function shiftItemsInRange(from,to){
  var out=[];
  cache.shifts.forEach(function(s){
    shiftDates(s).forEach(function(d){
      if(d<from||d>to) return;
      out.push({ type:"shift", date:d, guru:s.guru, start:timeToMins(s.open), end:timeToMins(s.close),
        startLbl:fmtTime(timeToMins(s.open)), endLbl:fmtTime(timeToMins(s.close)), shift:s });
    });
  });
  return out;
}
function unavailItemsInRange(from,to){
  var out=[];
  cache.unavail.forEach(function(u){
    var d=u.date, last=u.endDate||u.date;
    while(d<=last){
      if(d>=from && d<=to){
        out.push({ type:"unavail", date:d, guru:u.guru, allDay:!!u.allDay,
          start:u.allDay?0:timeToMins(u.start), end:u.allDay?1440:timeToMins(u.end),
          startLbl:u.allDay?"All day":fmtTime(timeToMins(u.start)),
          endLbl:u.allDay?"":fmtTime(timeToMins(u.end)), un:u });
      }
      d=addDays(d,1);
      if(out.length>1000) break;
    }
  });
  return out;
}

/* =================================================================
   CONFLICT ENGINE
   red    = same guru, two events overlap in time
   yellow = same guru, gap between events under 15 minutes
   flag   = guru scheduled on retail store shift during an event (allowed)
   block  = guru marked unavailable (HARD block on assignment)
   ================================================================= */
var TIGHT_MIN = 15;
function conflictsForGuru(guru, from, to, skipEventId, injected){
  // injected: optional extra event items to test (used before saving)
  var evs=eventItemsInRange(from,to).filter(function(it){ return it.gurus.indexOf(guru)>=0 && (!skipEventId || it.eventId!==skipEventId); });
  if(injected) evs=evs.concat(injected);
  var shifts=shiftItemsInRange(from,to).filter(function(it){ return it.guru===guru; });
  var unav=unavailItemsInRange(from,to).filter(function(it){ return it.guru===guru; });
  var out=[];
  // group by date
  var byDate={};
  evs.forEach(function(it){ (byDate[it.date]=byDate[it.date]||[]).push(it); });
  Object.keys(byDate).forEach(function(d){
    var list=byDate[d].slice().sort(function(a,b){ return a.start-b.start; });
    for(var i=0;i<list.length;i++) for(var j=i+1;j<list.length;j++){
      var A=list[i], B=list[j];
      if(A.eventId===B.eventId) continue;
      if(rangesOverlap(A.start,A.end,B.start,B.end)) out.push({sev:"red", guru:guru, date:d, a:A, b:B, text:"Events overlap"});
      else {
        var gap = Math.max(A.start,B.start) - Math.min(A.end,B.end);
        if(gap>=0 && gap<TIGHT_MIN) out.push({sev:"yellow", guru:guru, date:d, a:A, b:B, text:"Only "+gap+" min between events"});
      }
    }
  });
  // store overlap flags
  evs.forEach(function(E){
    shifts.forEach(function(S){
      if(S.date===E.date && rangesOverlap(E.start,E.end,S.start,S.end))
        out.push({sev:"flag", guru:guru, date:E.date, a:E, b:S, text:"Running retail store during this event (allowed)"});
    });
  });
  // unavailability violations
  evs.forEach(function(E){
    unav.forEach(function(U){
      if(U.date===E.date && rangesOverlap(E.start,E.end,U.start,U.end))
        out.push({sev:"block", guru:guru, date:E.date, a:E, b:U, text:"Guru marked UNAVAILABLE at this time"});
    });
  });
  return out;
}

function setView(v){

  ["sched","assign","shifts","unavail","audit","export"].forEach(function(x){
    $("view-"+x).style.display = x===v ? "block":"none";

/* ---------------- SCHEDULE ---------------- */
function schedRange(){
  if(sched.mode==="day") return [sched.anchor, sched.anchor];
  var ws=weekStart(sched.anchor); return [ws, addDays(ws,6)];
}
function schedNav(n){
  sched.anchor = addDays(sched.anchor, sched.mode==="day" ? n : n*7);
  renderSched();
}
function toggleGuruFilter(g){
  if(!sched.filter) sched.filter={};
  if(sched.filter[g]) delete sched.filter[g]; else sched.filter[g]=true;
  if(!Object.keys(sched.filter).length) sched.filter=null;
  renderSched();
}
function guruVisible(g){ return !sched.filter || sched.filter[g]; }

function renderSched(){
  var r=schedRange(), from=r[0], to=r[1];
  var evs=eventItemsInRange(from,to);
  var shifts=shiftItemsInRange(from,to);
  var unav=unavailItemsInRange(from,to);
  // conflicts across all gurus in this window (for outlines)
  var confKeys={};
  allGuruNames().forEach(function(g){
    conflictsForGuru(g,from,to).forEach(function(c){
      if(c.sev==="red"||c.sev==="block"){ confKeys[c.a.eventId+"|"+c.date]="red"; confKeys[c.b.eventId+"|"+c.date]="red"; }
      else if(c.sev==="yellow"){ if(!confKeys[c.a.eventId+"|"+c.date])confKeys[c.a.eventId+"|"+c.date]="yel"; if(!confKeys[c.b.eventId+"|"+c.date])confKeys[c.b.eventId+"|"+c.date]="yel"; }
    });
  });

  var names=allGuruNames();
  var h='<div class="card">';
  h+='<div class="sched-controls">'+
     '<button class="btn btn-sm btn-ghost" onclick="schedNav(-1)">◀</button>'+
     '<button class="btn btn-sm btn-ghost" onclick="sched.anchor=todayStr();renderSched()">Today</button>'+
     '<button class="btn btn-sm btn-ghost" onclick="schedNav(1)">▶</button>'+
     '<input type="date" value="'+sched.anchor+'" onchange="sched.anchor=this.value;renderSched()">'+
     '<button class="btn btn-sm '+(sched.mode==="day"?"":"btn-ghost")+'" onclick="sched.mode=\'day\';renderSched()">Day</button>'+
     '<button class="btn btn-sm '+(sched.mode==="week"?"":"btn-ghost")+'" onclick="sched.mode=\'week\';renderSched()">Week</button>'+
     '<label style="margin-left:8px;"><input type="checkbox" '+(sched.showUnassigned?"checked":"")+' onchange="sched.showUnassigned=this.checked;renderSched()"> show unassigned</label>'+
     '</div>';
  h+='<div style="margin-bottom:10px;">Filter: ';
  names.forEach(function(g){
    var on=guruVisible(g);
    h+='<span class="chip guru" style="background:'+(on?guruColor(g):"#bbb")+';cursor:pointer;" onclick="toggleGuruFilter(\''+esc(g)+'\')">'+esc(g)+'</span>';
  });
  h+='<span class="chip store">🏪 store shift</span><span class="chip unav">🚫 unavailable</span></div>';

  // hour range
  var hStart=8, hEnd=23;
  evs.concat(shifts).concat(unav).forEach(function(it){
    if(it.allDay) return;
    hStart=Math.min(hStart, Math.floor(it.start/60));
    hEnd=Math.max(hEnd, Math.ceil(it.end/60));
  });
  hStart=Math.max(0,hStart); hEnd=Math.min(24,Math.max(hEnd,hStart+8));
  var ROW=44, bodyH=(hEnd-hStart)*ROW;
  function top(m){ return (m/60-hStart)*ROW; }

  var days=[]; for(var d=from; d<=to; d=addDays(d,1)){ days.push(d); if(days.length>7) break; }

  h+='<div class="sched-scroll"><div class="sched-grid">';
  h+='<div class="sched-timecol">';
  for(var hr=hStart;hr<hEnd;hr++) h+='<div class="hrlab">'+fmtTime(hr*60)+'</div>';
  h+='</div>';

  days.forEach(function(d){
    var dayShifts=shifts.filter(function(s){ return s.date===d && guruVisible(s.guru); });
    var storeLine = dayShifts.length
      ? dayShifts.map(function(s){ return esc(s.guru)+" "+s.startLbl+"–"+s.endLbl; }).join(" · ")
      : "store: no shift set";
    h+='<div class="sched-day"><div class="sched-dayhead"><b>'+fmtDate(d)+'</b><div class="storeline">🏪 '+storeLine+'</div></div>';
    h+='<div class="sched-body" style="height:'+bodyH+'px;">';

    // store shift bands (behind)
    dayShifts.forEach(function(s){
      h+='<div class="blk shift" style="top:'+top(s.start)+'px;height:'+Math.max(16,top(s.end)-top(s.start))+'px;left:0;right:0;" title="Retail store: '+esc(s.guru)+'">🏪 '+esc(s.guru)+' '+s.startLbl+'–'+s.endLbl+'</div>';
    });
    // unavailability bands
    unav.filter(function(u){ return u.date===d && guruVisible(u.guru); }).forEach(function(u){
      h+='<div class="blk unav" style="top:'+top(u.start)+'px;height:'+Math.max(16,top(u.end)-top(u.start))+'px;left:2%;right:2%;" title="Unavailable">🚫 '+esc(u.guru)+' '+(u.allDay?"all day":(u.startLbl+"–"+u.endLbl))+'</div>';
    });

    // events — lane layout
    var dayEvs=evs.filter(function(e){
      if(e.date!==d) return false;
      if(e.gstate==="assigned") return e.gurus.some(guruVisible);
      return sched.showUnassigned && !sched.filter;
    }).sort(function(a,b){ return a.start-b.start || b.end-a.end; });
    var lanes=[];
    dayEvs.forEach(function(e){
      var li=0;
      while(li<lanes.length && lanes[li]>e.start) li++;
      if(li===lanes.length) lanes.push(0);
      lanes[li]=e.end; e._lane=li;
    });
    var laneCount=Math.max(1,lanes.length);
    dayEvs.forEach(function(e){
      var w=(70/laneCount), l=28+e._lane*w; // leave left gutter so store band labels stay readable
      var col = e.gstate==="assigned" ? guruColor(e.gurus[0]) : "#a8a288";
      var conf=confKeys[e.eventId+"|"+d];
      var cls="blk ev"+(e.gstate!=="assigned"?" unassigned":"")+(isDraftEvent(e.ev)?" draft":"")+(conf==="red"?" conf-red":conf==="yel"?" conf-yel":"");
      var label = e.gstate==="assigned" ? e.gurus.join(" + ") : (e.gstate==="none"?"No Guru needed":"UNASSIGNED");
      h+='<div class="'+cls+'" style="top:'+top(e.start)+'px;height:'+Math.max(22,top(e.end)-top(e.start))+'px;left:'+l+'%;width:'+(w-1)+'%;background:'+col+';" onclick="openDetails(\''+esc(e.eventId)+'\',\''+d+'\')">'+
         '<b>'+esc(label)+'</b>'+esc(e.title)+'<br>'+e.startLbl+(e.endLbl?("–"+e.endLbl):"")+'</div>';
    });
    h+='</div></div>';
  });
  h+='</div></div>';
  h+='<p class="hint" style="margin-bottom:0;">Blocks show <b>Guru name first</b>, then the event title — tap any block for full event details. Purple striped bands = retail store shifts (open/close). Red outline = same-Guru overlap; yellow outline = under '+TIGHT_MIN+' min between that Guru\'s events.</p>';
  h+='</div>';
  $("view-sched").innerHTML=h;
}

function gcalUrl(e,date,gurus){
  function g(d){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00"; }
  var dates;
  if(e.allDay){ var ds=(date||e.date).replace(/-/g,""); dates=ds+"/"+addDays(date||e.date,1).replace(/-/g,""); }
  else{
    var s=new Date((date||e.date)+"T"+(e.start||"12:00")+":00"), en=new Date((date||e.date)+"T"+(e.end||e.start||"12:00")+":00");
    if(en<=s) en=new Date(s.getTime()+2*3600000);

  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(txt)+
    "&dates="+dates+"&location="+encodeURIComponent("Northwood Game Haven, 115 W Spring St, Chippewa Falls, WI")+
    "&details="+encodeURIComponent("Guru schedule — gamehaven.guru");
}

function nextOccurrence(e){
  var t=todayStr(), ds=eventDates(e), best=null;
  ds.forEach(function(d){ if(d>=t && (best==null||d<best)) best=d; });
  return best || ds[ds.length-1] || e.date;
}
function renderAssign(){

    return true;
  }).sort(function(a,b){ return nextOccurrence(a)<nextOccurrence(b)?-1:1; });

function uncheckNone(eid){ var n=$("gkn-"+eid); if(n&&n.checked){ n.checked=false; n.parentNode.classList.remove("on"); } }
function clearGurus(eid){
  document.querySelectorAll(".gk-"+CSS.escape(eid)).forEach(function(c){ c.checked=false; c.parentNode.classList.remove("on"); });
  var o=$("gko-"+eid); if(o){ o.checked=false; o.parentNode.classList.remove("on"); }
  var on=$("gkoName-"+eid); if(on) on.style.display="none";
}
function collectGurus(eid){
  var out=[];
  document.querySelectorAll(".gk-"+CSS.escape(eid)).forEach(function(c){ if(c.checked) out.push(c.value); });
  var o=$("gko-"+eid);
  if(o&&o.checked){
    ($("gkoName-"+eid).value||"").split(",").forEach(function(n){ n=n.trim(); if(n&&out.indexOf(n)<0) out.push(n); });
  }
  return out;
}
async function saveAssignment(eid){
  var e=cache.events.find(function(x){ return x.id===eid; }); if(!e) return;
  var none=$("gkn-"+eid)&&$("gkn-"+eid).checked;
  var gurus=none?[]:collectGurus(eid);
  var dateSel=$("gkd-"+eid), date=dateSel?dateSel.value||null:null;
  var msg=$("gkmsg-"+eid);
  if(!none && !gurus.length){ msg.textContent="Pick at least one Guru, or choose None."; return; }

  if(!none){
    // client-side conflict preflight across the affected occurrence dates
    var dates = date?[date]:eventDates(e);
    var s=e.allDay?0:timeToMins(e.start), en=e.allDay?1440:timeToMins(e.end||e.start);
    var report=[];
    gurus.forEach(function(g){
      dates.forEach(function(d){
        var injected=[{type:"event",date:d,allDay:!!e.allDay,start:s,end:en,startLbl:e.allDay?"All day":fmtTime(s),endLbl:e.allDay?"":fmtTime(en),title:(e.title||"NGH Event"),eventId:e.id,ev:e,gurus:[g],gstate:"assigned"}];
        conflictsForGuru(g,d,d,e.id,injected).forEach(function(c){
          if(c.a.eventId===e.id||(c.b&&c.b.eventId===e.id)) report.push(c);
        });
      });
    });
    // de-dupe
    var seen={}; report=report.filter(function(c){ var k=c.sev+"|"+c.guru+"|"+c.date+"|"+(c.a.eventId||"")+"|"+((c.b&&(c.b.eventId||c.b.type))||""); if(seen[k])return false; seen[k]=1; return true; });
    var blocks=report.filter(function(c){ return c.sev==="block"; });
    if(blocks.length){ showConflictModal(report, null, true); return; }
    if(report.length){
      showConflictModal(report, async function(){ await pushAssignment(eid,date,gurus,none,msg); }, false);
      return;
    }
  }
  await pushAssignment(eid,date,gurus,none,msg);
}
async function pushAssignment(eid,date,gurus,none,msg){
  var existing = cache.assignments.find(function(a){ return a.eventId===eid && ((date&&a.date===date)||(!date&&a.date==null)); });
  try{
    await api("/gurus",{method:"POST",body:JSON.stringify({action:"save-assignment",item:{ id:existing?existing.id:undefined, eventId:eid, date:date, gurus:gurus, none:none }})});
    if(msg) msg.textContent="Saved ✓";
    await reload();
  }catch(err){
    if(err.status===409 && err.body && err.body.conflicts){
      var report=err.body.conflicts.map(function(v){
        return {sev:"block",guru:v.guru,date:v.date,a:{title:"This event",startLbl:"",endLbl:""},b:{type:"unavail",startLbl:v.allDay?"All day":fmtTime(timeToMins(v.start)),endLbl:v.allDay?"":fmtTime(timeToMins(v.end))},text:"Guru marked UNAVAILABLE"+(v.notes?(" — "+v.notes):"")};
      });
      showConflictModal(report,null,true);
    } else if(msg) msg.textContent="Save failed: "+err.message;
  }
}
async function deleteAssignment(id){
  await api("/gurus",{method:"POST",body:JSON.stringify({action:"delete-assignment",item:{id:id}})});
  await reload();
}
function confLineHTML(c){
  var badge=c.sev==="red"?'<span class="badge-red">RED · overlap</span>':c.sev==="yellow"?'<span class="badge-yel">YELLOW · tight</span>':c.sev==="flag"?'<span class="badge-flag">STORE · flag</span>':'<span class="badge-red">⛔ UNAVAILABLE</span>';
  function side(x){
    if(!x) return "";
    if(x.type==="shift") return "🏪 Retail store "+x.startLbl+"–"+x.endLbl;
    if(x.type==="unavail") return "🚫 Unavailable "+(x.startLbl||"")+(x.endLbl?("–"+x.endLbl):"");

async function saveUnavail(){

function exportItems(from,to){
  var pick=expGurus();
  var out=[];

    if(it.gstate!=="assigned") return;
    var gs=it.gurus.filter(function(g){ return pick.indexOf(g)>=0; });
    if(!gs.length) return;
    out.push({kind:"Event",gurus:gs,date:it.date,allDay:it.allDay,start:it.allDay?null:minsToTime(it.start),end:it.allDay?null:minsToTime(it.end),
      startLbl:it.startLbl,endLbl:it.endLbl,title:it.title,eventId:it.eventId,notes:(it.ev.notes||"")});
  });
  shiftItemsInRange(from,to).forEach(function(it){
    if(pick.indexOf(it.guru)<0) return;
    out.push({kind:"Store",gurus:[it.guru],date:it.date,allDay:false,start:minsToTime(it.start),end:minsToTime(it.end),
      startLbl:it.startLbl,endLbl:it.endLbl,title:"Retail Store",eventId:"",notes:it.shift.notes||""});
  });
  out.sort(function(a,b){ return (a.date+(a.start||""))<(b.date+(b.start||""))?-1:1; });

function download(name, mime, text){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:mime}));
  a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },400);
}
function exportCsv(){
  var rows=[["Type","Guru(s)","Date","Start","End","Title","EventID","Notes"]];
  exportItems(exp.from,exp.to).forEach(function(it){
    rows.push([it.kind,it.gurus.join(" + "),it.date,it.allDay?"All day":it.start,it.allDay?"":it.end,it.title,it.eventId,it.notes]);
  });
  var csv=rows.map(function(r){ return r.map(function(c){ c=String(c==null?"":c); return '"'+c.replace(/"/g,'""')+'"'; }).join(","); }).join("\r\n");
  download("ngh-guru-schedule.csv","text/csv;charset=utf-8","\uFEFF"+csv);
}
function icsEsc(t){ return String(t||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function exportIcs(){
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Northwood Game Haven//Guru Schedule//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:NGH Guru Schedule"];
  var stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  exportItems(exp.from,exp.to).forEach(function(it,i){
    L.push("BEGIN:VEVENT");
    L.push("UID:ngh-guru-"+it.date+"-"+i+"@gamehaven.guru");
    L.push("DTSTAMP:"+stamp);
    if(it.allDay){ L.push("DTSTART;VALUE=DATE:"+it.date.replace(/-/g,"")); L.push("DTEND;VALUE=DATE:"+addDays(it.date,1).replace(/-/g,"")); }
    else{ L.push("DTSTART:"+it.date.replace(/-/g,"")+"T"+it.start.replace(":","")+"00"); L.push("DTEND:"+it.date.replace(/-/g,"")+"T"+it.end.replace(":","")+"00"); }
    L.push("SUMMARY:"+icsEsc(it.gurus.join(" + ")+" — "+(it.kind==="Store"?"🏪 Retail Store":it.title)));
    if(it.notes) L.push("DESCRIPTION:"+icsEsc(it.notes));
    L.push("LOCATION:Northwood Game Haven\\, 115 W Spring St\\, Chippewa Falls\\, WI");
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  download("ngh-guru-schedule.ics","text/calendar;charset=utf-8",L.join("\r\n"));
}

    var u=location.origin+API_BASE+"/gurus?ics=1&key="+encodeURIComponent(r.key);
    if(pick.length!==all.length) u+="&gurus="+encodeURIComponent(pick.join(","));
    out.innerHTML='<b>Feed URL:</b><br>'+esc(u)+'<br><button class="btn btn-xs btn-ghost" style="margin-top:6px;" onclick="navigator.clipboard.writeText(\''+u.replace(/'/g,"\\'")+'\');this.textContent=\'Copied ✓\'">Copy</button> '+
      '<a class="btn btn-xs btn-ghost" style="text-decoration:none;" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/u/0/r/settings/addbyurl">Open Google → Add by URL</a>'+
      '<div class="hint" style="margin-top:6px;">In Google Calendar: Settings → Add calendar → From URL → paste. Outlook: Add calendar → Subscribe from web. Keep this URL private — it grants read access to the Guru schedule.</div>';
  }catch(e){ out.textContent="Could not fetch feed key: "+e.message; }
}
function doPrint(){
  var from,to,label;
  if(exp.printMode==="day"){ from=exp.printAnchor; to=from; label=fmtDate(from); }
  else if(exp.printMode==="week"){ from=weekStart(exp.printAnchor); to=addDays(from,6); label="Week of "+fmtDate(from); }
  else { from=monthStart(exp.printAnchor); to=addDays(addMonths(from,1),-1); label=from.slice(0,7); }
  var items=exportItems(from,to);
  var byDate={}; items.forEach(function(it){ (byDate[it.date]=byDate[it.date]||[]).push(it); });
  var h='<h1>🦦 Northwood Game Haven — Guru Schedule</h1>'+
    '<div>'+esc(label)+' · Gurus: '+esc(expGurus().join(", "))+' · printed '+todayStr()+'</div><br>';
  var any=false;
  for(var d=from; d<=to; d=addDays(d,1)){
    var list=byDate[d]||[];
    if(!list.length && exp.printMode==="month") continue;
    any=true;
    h+='<div class="pr-day"><h3>'+fmtDate(d)+' ('+d+')</h3>';
    if(!list.length){ h+='<div style="font-size:11px;color:#666;">— nothing scheduled —</div></div>'; continue; }
    h+='<table><tr><th style="width:18%;">Guru(s)</th><th style="width:14%;">Time</th><th>What</th><th style="width:26%;">Notes</th></tr>';
    list.forEach(function(it){
      h+='<tr><td class="pr-guru">'+esc(it.gurus.join(" + "))+'</td><td>'+(it.allDay?"All day":(it.startLbl+" – "+it.endLbl))+'</td>'+
        '<td>'+(it.kind==="Store"?"🏪 Retail Store (open–close)":esc(it.title))+'</td><td>'+esc(it.notes)+'</td></tr>';
    });
    h+='</table></div>';
  }
  if(!any) h+='<div>Nothing scheduled in this range.</div>';
  $("print-area").innerHTML=h;
  window.print();
}

(function init(){
  $("admin-code").addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });
  if(token()){ boot().catch(function(){ sessionStorage.removeItem("ngh_admin_token"); }); }
})();
